name: Export Android ARM64 Toolchain

on:
  push:
    branches:
      - lab/export-android-toolchain
    paths:
      - ".github/workflows/export-android-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve sdkmanager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses >/dev/null || true
          "${{ steps.sdk.outputs.sdkmanager }}" "ndk;26.1.10909125" >/dev/null

      - name: Fetch SDL2 headers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-2.30.11 https://github.com/libsdl-org/SDL.git sdl2

      - name: Pack minimal ARM64 NDK + SDL2 headers
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          PRE="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          ROOT="$RUNNER_TEMP/android-arm64-toolchain"
          mkdir -p "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/lib"
          mkdir -p "$ROOT/ndk/build/cmake"
          mkdir -p "$ROOT/sdl2"

          cp "$NDK/source.properties" "$ROOT/ndk/"
          cp "$NDK/build/cmake/android.toolchain.cmake" "$ROOT/ndk/build/cmake/"

          mkdir -p "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr"
          cp -a "$PRE/sysroot/usr/include" "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/"
          mkdir -p "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          cp -a "$PRE/sysroot/usr/lib/aarch64-linux-android" "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/"

          CLANG_VER="$(basename "$(find "$PRE/lib/clang" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)")"
          mkdir -p "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/$CLANG_VER"
          cp -a "$PRE/lib/clang/$CLANG_VER/include" "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/$CLANG_VER/"
          mkdir -p "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/$CLANG_VER/lib/linux"
          cp "$PRE/lib/clang/$CLANG_VER/lib/linux/libclang_rt.builtins-aarch64-android.a" "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/$CLANG_VER/lib/linux/"

          for f in clang clang++ ld.lld lld llvm-ar llvm-ranlib llvm-strip llvm-nm llvm-objcopy; do
            cp -L "$PRE/bin/$f" "$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/$f"
          done

          cp -a sdl2/include "$ROOT/sdl2/include"

          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/android-arm64-toolchain-mini.tar.gz" android-arm64-toolchain
          ls -lh "$RUNNER_TEMP/android-arm64-toolchain-mini.tar.gz"
          du -sh "$ROOT" | tee "$RUNNER_TEMP/DU.txt"
          sha256sum "$RUNNER_TEMP/android-arm64-toolchain-mini.tar.gz" | tee "$RUNNER_TEMP/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-toolchain-mini
          path: |
            ${{ runner.temp }}/android-arm64-toolchain-mini.tar.gz
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/DU.txt
          retention-days: 2
          compression-level: 0
