name: Build RS Local Storage V4.1.1 R10 APK
on:
  pull_request:
    branches: [ editor ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain and workflow parser
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
          python3 -m pip install --disable-pip-version-check pyyaml
      - name: Reuse validated R9 source and runtime pipeline
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          wf=yaml.safe_load(Path('.github/workflows/rs-local-storage-v411-r9.yml').read_text())
          wanted={
              'Reuse validated R8 source and runtime pipeline',
              'Apply R9 accessibility and resilient media controls',
          }
          found=set()
          for step in wf['jobs']['build']['steps']:
              name=step.get('name')
              if name in wanted:
                  subprocess.run(['bash','-lc',step['run']],check=True)
                  found.add(name)
          missing=wanted-found
          if missing: raise SystemExit(f'R9 pipeline steps missing: {sorted(missing)}')
          PY
      - name: Apply R10 native Android navigation
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          g=Path('rs-local-storage-v41/rsapp/build.gradle.kts')
          gs=g.read_text()
          if 'versionCode = 13' not in gs or 'versionName = "4.1.1-r9"' not in gs:
              raise SystemExit('R9 version marker missing')
          g.write_text(gs.replace('versionCode = 13','versionCode = 14').replace('versionName = "4.1.1-r9"','versionName = "4.1.1-r10"'))

          p=Path('rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MainActivity.java')
          s=p.read_text()
          if 'LinearLayout server=card()' not in s or 'setContentView(sc);' not in s:
              raise SystemExit('MainActivity baseline markers missing')
          if 'MainNavigation.show' in s:
              raise SystemExit('Navigation unexpectedly already applied')

          s=s.replace(
              '    TextView status,clientCount,libraryStatus,aiStatus;\n',
              '    TextView status,clientCount,libraryStatus,aiStatus;\n    ScrollView sc; LinearLayout root;\n    View serverSection,adminSection,librarySection,aiSection,clientsSection;\n',1)
          old='''        ScrollView sc=new ScrollView(this);sc.setBackgroundColor(BLACK);\n        LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setPadding(dp(18),dp(26),dp(18),dp(48));sc.addView(root);\n\n        TextView brand=txt("RS",15,ORANGE);brand.setTypeface(null,1);root.addView(brand);'''
          new='''        LinearLayout page=new LinearLayout(this);page.setOrientation(LinearLayout.VERTICAL);page.setBackgroundColor(BLACK);\n        LinearLayout nav=new LinearLayout(this);nav.setGravity(Gravity.CENTER_VERTICAL);nav.setPadding(dp(12),dp(8),dp(12),dp(8));nav.setBackgroundColor(Color.rgb(16,16,16));\n        Button menu=new Button(this);menu.setText("☰  Menu");menu.setAllCaps(false);menu.setTextColor(WHITE);menu.setTypeface(null,1);menu.setTextSize(15);menu.setBackground(bg(Color.rgb(36,36,36),12));menu.setOnClickListener(v->MainNavigation.show(this,menu,sc,serverSection,adminSection,librarySection,aiSection,clientsSection));nav.addView(menu,new LinearLayout.LayoutParams(dp(120),dp(48)));\n        TextView navTitle=txt("RS Local Storage",16,WHITE);navTitle.setTypeface(null,1);navTitle.setGravity(Gravity.END|Gravity.CENTER_VERTICAL);nav.addView(navTitle,new LinearLayout.LayoutParams(0,dp(48),1));\n        page.addView(nav,new LinearLayout.LayoutParams(-1,dp(64)));\n        sc=new ScrollView(this);sc.setBackgroundColor(BLACK);sc.setFillViewport(true);\n        root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setPadding(dp(18),dp(20),dp(18),dp(48));sc.addView(root);page.addView(sc,new LinearLayout.LayoutParams(-1,0,1));\n\n        TextView brand=txt("RS",15,ORANGE);brand.setTypeface(null,1);root.addView(brand);'''
          if old not in s: raise SystemExit('ScrollView scaffold marker missing')
          s=s.replace(old,new,1)
          s=s.replace('LinearLayout server=card();server.addView(heading("Servidor privado"));','LinearLayout server=card();serverSection=server;server.addView(heading("Servidor privado"));',1)
          s=s.replace('LinearLayout admin=card();admin.addView(heading("Administrador"));','LinearLayout admin=card();adminSection=admin;admin.addView(heading("Administrador"));',1)
          s=s.replace('LinearLayout lib=card();lib.addView(heading("Biblioteca RS Media"));','LinearLayout lib=card();librarySection=lib;lib.addView(heading("Biblioteca RS Media"));',1)
          s=s.replace('LinearLayout ai=card();ai.addView(heading("RS AI · local"));','LinearLayout ai=card();aiSection=ai;ai.addView(heading("RS AI · local"));',1)
          s=s.replace('LinearLayout clientCard=card();LinearLayout ch=','LinearLayout clientCard=card();clientsSection=clientCard;LinearLayout ch=',1)
          s=s.replace('        setContentView(sc);','        setContentView(page);',1)
          p.write_text(s)

          nav=Path('rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MainNavigation.java')
          if not nav.exists(): raise SystemExit('Canonical MainNavigation.java missing from branch')
          ns=nav.read_text()
          for marker in ['PopupMenu','File Storage · Web','RS Cinema · Web','/admin/files','/cinema']:
              if marker not in ns: raise SystemExit(f'Navigation source marker missing: {marker}')
          for marker in ['MainNavigation.show','setContentView(page)','serverSection=server','clientsSection=clientCard']:
              if marker not in s: raise SystemExit(f'MainActivity navigation marker missing: {marker}')

          proof=Path('rs-local-storage-v41/rsapp/src/main/assets/RS_BUILD_PROOF.txt')
          previous=proof.read_text() if proof.exists() else ''
          proof.write_text(previous.replace('RS Local Storage V4.1.1 R9','RS Local Storage V4.1.1 R10')+'AndroidNavigation=native-fixed-menu+8-destinations\n')
          PY
          grep -q 'versionCode = 14' rs-local-storage-v41/rsapp/build.gradle.kts
          grep -q 'versionName = "4.1.1-r10"' rs-local-storage-v41/rsapp/build.gradle.kts
          grep -q 'MainNavigation.show' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MainActivity.java
          grep -q 'File Storage · Web' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MainNavigation.java
          grep -q 'RS Cinema · Web' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MainNavigation.java
          grep -q 'isPermanentLibraryNode' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          grep -q 'ensureDirectory(mediaRoot())' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MediaLibrary.java
      - name: Compile and build APK
        run: |
          cp -R rs-local-storage-v41/rsapp llama.cpp/examples/llama.android/rsapp
          printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts
          cd llama.cpp/examples/llama.android
          chmod +x gradlew
          ./gradlew :rsapp:compileDebugKotlin :rsapp:compileDebugJavaWithJavac --stacktrace --no-daemon
          ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.13113456 ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
      - name: Validate APK and native navigation proof
        run: |
          set -euxo pipefail
          APK=llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='14'" /tmp/badging.txt
          grep -q "versionName='4.1.1-r10'" /tmp/badging.txt
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/RS_BUILD_PROOF.txt | tee /tmp/rs-proof.txt
          grep -q 'Biblioteca=non-destructive-protected' /tmp/rs-proof.txt
          grep -q 'AndroidNavigation=native-fixed-menu+8-destinations' /tmp/rs-proof.txt
          unzip -p "$APK" classes.dex | strings | grep -q 'MainNavigation'
          unzip -p "$APK" classes.dex | strings | grep -q 'File Storage · Web'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" RS-Local-Storage-v4.1.1-R10.apk
          sha256sum RS-Local-Storage-v4.1.1-R10.apk | tee RS-Local-Storage-v4.1.1-R10.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RS-Local-Storage-v4.1.1-R10-APK
          path: |
            RS-Local-Storage-v4.1.1-R10.apk
            RS-Local-Storage-v4.1.1-R10.sha256
          if-no-files-found: error
