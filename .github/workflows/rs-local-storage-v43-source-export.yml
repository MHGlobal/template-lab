name: RS Local Storage V4.3 Source Recovery

on:
  pull_request:
    branches: [ rs-local-storage-v42-ci-wrapper-final ]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workflow parser
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Materialize validated V4.2.5 source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('.github/workflows/rs-local-storage-v411-r11.yml').read_text())
          wanted = {
              'Reuse validated R10 source pipeline',
              'Apply R11 navigation UX and accessibility hardening',
          }
          found = set()
          for step in wf['jobs']['build']['steps']:
              name = step.get('name')
              if name in wanted:
                  run = step.get('run')
                  if not run:
                      raise SystemExit(f'R11 step has no run body: {name}')
                  subprocess.run(['bash', '-lc', run], check=True)
                  found.add(name)
          missing = wanted - found
          if missing:
              raise SystemExit(f'R11 source pipeline steps missing: {sorted(missing)}')
          PY

          base64 -d rs-v42/apply_v42.py.gz.b64 | gunzip > /tmp/apply_v42.py
          python3 -m py_compile /tmp/apply_v42.py
          python3 /tmp/apply_v42.py

          test -f rs-local-storage-v41/rsapp/build.gradle.kts
          test -f rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          test -f rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/AiWebBridge.kt
          grep -q 'versionName = "4.2.5"' rs-local-storage-v41/rsapp/build.gradle.kts

      - name: Export recovered source
        run: |
          set -euxo pipefail
          tar -czf RS-Local-Storage-v4.2.5-recovered-source.tar.gz rs-local-storage-v41
          sha256sum RS-Local-Storage-v4.2.5-recovered-source.tar.gz > RS-Local-Storage-v4.2.5-recovered-source.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RS-Local-Storage-v4.2.5-Recovered-Source
          path: |
            RS-Local-Storage-v4.2.5-recovered-source.tar.gz
            RS-Local-Storage-v4.2.5-recovered-source.sha256
          if-no-files-found: error
          retention-days: 2
