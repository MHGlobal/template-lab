name: Package Ro-Uxui-Designer Skills

on:
  workflow_dispatch:
  push:
    branches: [editor]
    paths:
      - ".github/workflows/package-ro-uxui-skills.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout template-lab
        uses: actions/checkout@v4

      - name: Download and package Ro-Uxui-Designer skills
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/ro-uxui-package"
          SRC="$ROOT/src"
          OUT="$ROOT/Ro-Uxui-Designer-Skills"
          SKILLS="$OUT/skills"
          mkdir -p "$SRC" "$SKILLS" "$OUT/LICENSES"

          clone_repo() {
            local alias="$1"
            local repo="$2"
            echo "::group::Clone $repo"
            git clone --depth 1 "https://github.com/$repo.git" "$SRC/$alias"
            git -C "$SRC/$alias" rev-parse HEAD
            echo "::endgroup::"
          }

          copy_skill() {
            local alias="$1"
            local source_path="$2"
            local dest_name="$3"
            local src="$SRC/$alias/$source_path"
            local dst="$SKILLS/$dest_name"

            if [[ ! -f "$src/SKILL.md" ]]; then
              echo "::error::Missing SKILL.md: $alias/$source_path"
              exit 1
            fi

            rm -rf "$dst"
            mkdir -p "$dst"
            cp -a "$src/." "$dst/"
            printf '%s\n' "$alias" > "$dst/.source-repo-alias"
          }

          copy_root_skill() {
            local alias="$1"
            local dest_name="$2"
            local src="$SRC/$alias"
            local dst="$SKILLS/$dest_name"

            if [[ ! -f "$src/SKILL.md" ]]; then
              echo "::error::Missing root SKILL.md: $alias"
              exit 1
            fi

            rm -rf "$dst"
            mkdir -p "$dst"
            rsync -a --exclude='.git' "$src/" "$dst/"
            printf '%s\n' "$alias" > "$dst/.source-repo-alias"
          }

          copy_license() {
            local alias="$1"
            local repo="$SRC/$alias"
            for f in LICENSE LICENSE.md LICENSE.txt COPYING COPYING.md; do
              if [[ -f "$repo/$f" ]]; then
                cp "$repo/$f" "$OUT/LICENSES/$alias-${f//\//_}"
                return 0
              fi
            done
            echo "No top-level license file found during packaging." > "$OUT/LICENSES/$alias-NOT-FOUND.txt"
          }

          clone_repo better-web-ui aladicf/better-web-ui
          clone_repo vercel-agent-skills vercel-labs/agent-skills
          clone_repo gabeosx-agent-skills gabeosx/agent-skills
          clone_repo mblode-agent-skills mblode/agent-skills
          clone_repo ux-ui-agent-skills plugin87/ux-ui-agent-skills
          clone_repo allonsy-agent-skills allonsy-studio/agent-skills
          clone_repo magnus-agent-skills magnus919/agent-skills
          clone_repo playwright-cli microsoft/playwright-cli
          clone_repo roninforge-playwright RoninForge/roninforge-playwright
          clone_repo ux-audit-skill paulunemoon/ux-audit-skill
          clone_repo awesome-design EagleFandel/awesome-design
          clone_repo tasteskill tasteskill/tasteskill
          clone_repo nolly-agent-skills nolly-studio/agent-skills
          clone_repo ui-ux-pro-max nextlevelbuilder/ui-ux-pro-max-skill

          for skill in             frontend-design add-ui adapt arrange hierarchy colorize typeset polish             normalize critique audit a11y test animate clarify forms empty-state             harden optimize
          do
            copy_skill better-web-ui ".opencode/skills/$skill" "$skill"
          done

          copy_skill vercel-agent-skills "skills/web-design-guidelines" "web-design-guidelines"
          copy_skill gabeosx-agent-skills "skills/ux-designer" "ux-designer"

          copy_skill mblode-agent-skills "skills/product-design" "product-design"
          copy_skill mblode-agent-skills "skills/ui-design" "ui-design"
          copy_skill mblode-agent-skills "skills/ui-verification" "ui-verification"
          copy_skill mblode-agent-skills "skills/typography-audit" "typography-audit"
          copy_skill mblode-agent-skills "skills/ui-animation" "ui-animation"

          copy_skill ux-ui-agent-skills ".claude/skills/image-to-code" "image-to-code"
          copy_skill ux-ui-agent-skills ".claude/skills/design-code" "design-code"
          copy_skill ux-ui-agent-skills ".claude/skills/design-component" "design-component"

          copy_skill allonsy-agent-skills "skills/design-system" "design-system"
          copy_skill magnus-agent-skills "frontend-engineering" "frontend-engineering"
          copy_skill magnus-agent-skills "web-accessibility" "web-accessibility"

          copy_skill playwright-cli "skills/playwright-cli" "playwright-cli"
          copy_skill roninforge-playwright "skills/playwright-visual-regression" "playwright-visual-regression"

          copy_root_skill ux-audit-skill "ux-audit"
          copy_root_skill awesome-design "awesome-design"

          copy_skill tasteskill "skills/taste-skill" "design-taste-frontend"
          copy_skill nolly-agent-skills "skills/design-md" "design-md"
          copy_skill ui-ux-pro-max ".claude/skills/ui-ux-pro-max" "ui-ux-pro-max"

          for alias in             better-web-ui vercel-agent-skills gabeosx-agent-skills mblode-agent-skills             ux-ui-agent-skills allonsy-agent-skills magnus-agent-skills playwright-cli             roninforge-playwright ux-audit-skill awesome-design tasteskill             nolly-agent-skills ui-ux-pro-max
          do
            copy_license "$alias"
          done

          {
            echo "# Ro-Uxui-Designer Skills Bundle"
            echo
            echo "Generated by GitHub Actions from public source repositories."
            echo
            echo "## Source commits"
            for alias in               better-web-ui vercel-agent-skills gabeosx-agent-skills mblode-agent-skills               ux-ui-agent-skills allonsy-agent-skills magnus-agent-skills playwright-cli               roninforge-playwright ux-audit-skill awesome-design tasteskill               nolly-agent-skills ui-ux-pro-max
            do
              printf -- "- %s: %s\n" "$alias" "$(git -C "$SRC/$alias" rev-parse HEAD)"
            done
            echo
            echo "## Included skills"
            find "$SKILLS" -mindepth 1 -maxdepth 1 -type d -printf -- "- %f\n" | sort
          } > "$OUT/MANIFEST.md"

          cat > "$OUT/README.md" <<'EOF'
          # Ro-Uxui-Designer Skills

          This bundle contains the curated UI/UX/web-design skill set for the existing
          `Ro-Uxui-Designer` OpenCode subagent.

          ## Installation target

          Copy the desired skill directories from `skills/` into the OpenCode skills
          location used by your environment (for example `.opencode/skills/` or the
          configured global skills directory).

          Before enabling them, review each SKILL.md and preserve the current
          Ro-Uxui-Designer model/effort/permissions unless a change is intentionally
          required.

          The bundle includes source provenance and license files from each upstream
          repository where a top-level license file was available.
          EOF

          missing=0
          while IFS= read -r -d '' dir; do
            if [[ ! -f "$dir/SKILL.md" ]]; then
              echo "::error::Packaged skill lacks SKILL.md: $dir"
              missing=1
            fi
          done < <(find "$SKILLS" -mindepth 1 -maxdepth 1 -type d -print0)

          [[ "$missing" -eq 0 ]]

          count="$(find "$SKILLS" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          echo "Packaged skill count: $count"
          if [[ "$count" -ne 39 ]]; then
            echo "::error::Expected 39 skills but packaged $count"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          (
            cd "$ROOT"
            zip -qr "$GITHUB_WORKSPACE/dist/Ro-Uxui-Designer-Skills.zip" "Ro-Uxui-Designer-Skills"
          )

          sha256sum "$GITHUB_WORKSPACE/dist/Ro-Uxui-Designer-Skills.zip" | tee "$GITHUB_WORKSPACE/dist/Ro-Uxui-Designer-Skills.zip.sha256"

          echo "Package:"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload Ro-Uxui-Designer skills bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ro-Uxui-Designer-Skills
          path: |
            dist/Ro-Uxui-Designer-Skills.zip
            dist/Ro-Uxui-Designer-Skills.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
