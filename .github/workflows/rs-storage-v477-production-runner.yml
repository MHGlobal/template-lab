name: RS Storage 4.7.7 Production Runner

on:
  workflow_dispatch:
  push:
    branches: [ rs-storage-v477-rebuild-runner ]
    paths: [ '.github/workflows/rs-storage-v477-production-runner.yml' ]

permissions:
  contents: read

concurrency:
  group: rs-storage-v477-production-runner
  cancel-in-progress: true

jobs:
  build-v477:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      ROOT: source/current-v4.3.0
      LLAMA_REV: 8ef78e644f559db4e8716b59bf76b8e11619337d
      NDK_VERSION: 29.0.13113456
      CMAKE_VERSION: 3.31.6
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canonical 4.7.1 baseline
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: fix/v4.7-audit-blockers
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout 4.7.7 patch line
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: release/v4.7.7-ui-rsfile-rebuild
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: patch-src
          persist-credentials: false
          fetch-depth: 1

      - name: Record source commits and contracts
        shell: bash
        run: |
          set -euxo pipefail
          echo "RS_STORAGE_BASE_COMMIT=$(git -C private-src rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RS_STORAGE_PATCH_COMMIT=$(git -C patch-src rev-parse HEAD)" >> "$GITHUB_ENV"
          test -s private-src/scripts/materialize_v471_release.sh
          for f in \
            apply_v472_fileop_isolation.py apply_v472_preview_policy.py apply_v472_folder_memory.py fix_v472_generated_literals.py audit_v472_release.py rsfile_v472_required_gate.mjs \
            apply_v473_professional_runtime.py apply_v473_tests.py audit_v473_professional_runtime.py \
            apply_v474_runtime_remediation.py apply_v474_tests.py apply_v474_compile_fix.py audit_v474_release.py \
            apply_v475_production_polish.py audit_v475_production.py \
            apply_v476_production_completion.py audit_v476_production.py rs_v476_production_browser_gate.mjs \
            apply_v477_android_ui_rebuild.py apply_v477_android_product_shell.py fix_v477_android_product_shell_compile.py audit_v477_android_ui.py \
            apply_v477_web_file_workspace.py fix_v477_web_file_workspace.py audit_v477_web_file_workspace.py rsfile_v477_real_runtime_gate.mjs \
            patch_v471_llama_cmake.py; do
            test -s "patch-src/scripts/$f"
          done
          test -s patch-src/scripts/v475_payload/main.jsx
          test -s patch-src/scripts/v475_payload/style.css
          test -s patch-src/scripts/v476_payload/main.jsx
          test -s patch-src/scripts/v476_payload/style.css

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize canonical source through 4.7.7
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/materialize_v471_release.sh
          mkdir -p scripts/v475_payload scripts/v476_payload
          for f in \
            apply_v472_fileop_isolation.py apply_v472_preview_policy.py apply_v472_folder_memory.py fix_v472_generated_literals.py audit_v472_release.py rsfile_v472_required_gate.mjs \
            apply_v473_professional_runtime.py apply_v473_tests.py audit_v473_professional_runtime.py \
            apply_v474_runtime_remediation.py apply_v474_tests.py apply_v474_compile_fix.py audit_v474_release.py \
            apply_v475_production_polish.py audit_v475_production.py \
            apply_v476_production_completion.py audit_v476_production.py rs_v476_production_browser_gate.mjs \
            apply_v477_android_ui_rebuild.py apply_v477_android_product_shell.py fix_v477_android_product_shell_compile.py audit_v477_android_ui.py \
            apply_v477_web_file_workspace.py fix_v477_web_file_workspace.py audit_v477_web_file_workspace.py rsfile_v477_real_runtime_gate.mjs \
            patch_v471_llama_cmake.py; do
            cp "../patch-src/scripts/$f" "scripts/$f"
          done
          cp ../patch-src/scripts/v475_payload/main.jsx scripts/v475_payload/main.jsx
          cp ../patch-src/scripts/v475_payload/style.css scripts/v475_payload/style.css
          cp ../patch-src/scripts/v476_payload/main.jsx scripts/v476_payload/main.jsx
          cp ../patch-src/scripts/v476_payload/style.css scripts/v476_payload/style.css

          {
            scripts/materialize_v471_release.sh "$ROOT"
            python3 scripts/apply_v472_fileop_isolation.py "$ROOT"
            python3 scripts/apply_v472_preview_policy.py "$ROOT"
            python3 scripts/apply_v472_folder_memory.py "$ROOT"
            python3 scripts/fix_v472_generated_literals.py "$ROOT"
            python3 scripts/audit_v472_release.py "$ROOT"
            python3 scripts/apply_v473_professional_runtime.py "$ROOT"
            python3 scripts/apply_v473_tests.py "$ROOT"
            python3 scripts/audit_v473_professional_runtime.py "$ROOT"
            python3 scripts/apply_v474_runtime_remediation.py "$ROOT"
            python3 scripts/apply_v474_tests.py "$ROOT"
            python3 scripts/apply_v474_compile_fix.py "$ROOT"
            python3 scripts/audit_v474_release.py "$ROOT"
            python3 scripts/apply_v475_production_polish.py "$ROOT"
            python3 scripts/audit_v475_production.py "$ROOT"
            python3 scripts/apply_v476_production_completion.py "$ROOT"
            python3 scripts/audit_v476_production.py "$ROOT"
            python3 scripts/apply_v477_android_ui_rebuild.py "$ROOT"
            python3 scripts/apply_v477_android_product_shell.py "$ROOT"
            python3 scripts/fix_v477_android_product_shell_compile.py "$ROOT"
            python3 scripts/audit_v477_android_ui.py "$ROOT"
            python3 scripts/apply_v477_web_file_workspace.py "$ROOT"
            python3 scripts/fix_v477_web_file_workspace.py "$ROOT"
            python3 scripts/audit_v477_web_file_workspace.py "$ROOT"
            echo RS_STORAGE_V477_DELIVERY_MATERIALIZED
          } | tee ../V477_MATERIALIZE.txt

          grep -q 'RS_STORAGE_V477_DELIVERY_MATERIALIZED' ../V477_MATERIALIZE.txt
          grep -q 'versionCode = 97' "$ROOT/rsapp/build.gradle.kts"
          grep -q 'versionName = "4.7.7"' "$ROOT/rsapp/build.gradle.kts"
          grep -q 'android:label="RS Storage"' "$ROOT/rsapp/src/main/AndroidManifest.xml"
          python3 scripts/audit_v477_android_ui.py "$ROOT" | tee ../V477_ANDROID_AUDIT.txt
          python3 scripts/audit_v477_web_file_workspace.py "$ROOT" | tee ../V477_WEB_AUDIT.txt
          grep -q 'V477_ANDROID_UI_AUDIT=18/18' ../V477_ANDROID_AUDIT.txt
          grep -q 'V477_WEB_FILE_AUDIT=19/19' ../V477_WEB_AUDIT.txt

      - name: Install Web and browser-test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          npm --prefix private-src/$ROOT/dynamic-ui pkg set 'devDependencies.@vitejs/plugin-react=5.1.4'
          npm --prefix private-src/$ROOT/dynamic-ui install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build Dynamic UI production bundle
        working-directory: private-src/source/current-v4.3.0/dynamic-ui
        shell: bash
        run: |
          set -euxo pipefail
          npm run build
          test -s dist/app.js
          test -s dist/style.css
          test -s dist/rs-file-v477-workspace.js
          test -s dist/rs-file-v477-workspace.css

      - name: Run RS FILE real 4.7.7 runtime gate
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/rsfile_v477_real_runtime_gate.mjs "$ROOT" | tee ../V477_RSFILE_REAL_RUNTIME.txt
          grep -q 'RSFILE_V477_REAL_RUNTIME_GATE=6/6' ../V477_RSFILE_REAL_RUNTIME.txt

      - name: Run legacy RS FILE regression gate
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/rsfile_v472_required_gate.mjs "$ROOT" | tee ../V477_RSFILE_LEGACY_REGRESSION.txt
          grep -q 'REQUIRED_GATE_PASS=12/12' ../V477_RSFILE_LEGACY_REGRESSION.txt

      - name: Run general Web production browser gate
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/rs_v476_production_browser_gate.mjs "$ROOT" | tee ../V477_WEB_PRODUCTION_BROWSER.txt
          grep -q 'RS_V476_PRODUCTION_BROWSER_GATE=PASS' ../V477_WEB_PRODUCTION_BROWSER.txt

      - name: Package Dynamic UI into Android assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf private-src/$ROOT/rsapp/src/main/assets/rs-dynamic
          mkdir -p private-src/$ROOT/rsapp/src/main/assets/rs-dynamic
          cp -a private-src/$ROOT/dynamic-ui/dist/. private-src/$ROOT/rsapp/src/main/assets/rs-dynamic/
          test -s private-src/$ROOT/rsapp/src/main/assets/rs-dynamic/app.js
          test -s private-src/$ROOT/rsapp/src/main/assets/rs-dynamic/style.css
          test -s private-src/$ROOT/rsapp/src/main/assets/rs-dynamic/rs-file-v477-workspace.js
          test -s private-src/$ROOT/rsapp/src/main/assets/rs-dynamic/rs-file-v477-workspace.css

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$ANDROID_HOME/cmake/$CMAKE_VERSION"

      - name: Prepare pinned llama.cpp Android tree
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp fetch --depth=1 origin "$LLAMA_REV"
          git -C llama.cpp checkout --detach "$LLAMA_REV"
          python3 private-src/scripts/apply_llama_rs_compat.py llama.cpp
          python3 private-src/scripts/apply_v434_load_progress.py llama.cpp
          python3 private-src/scripts/apply_v450_llama_runtime.py llama.cpp
          python3 private-src/scripts/patch_v471_llama_cmake.py llama.cpp
          rm -rf llama.cpp/examples/llama.android/rsapp
          cp -R private-src/$ROOT/rsapp llama.cpp/examples/llama.android/rsapp
          grep -q 'include(":rsapp")' llama.cpp/examples/llama.android/settings.gradle.kts || printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts
          chmod +x llama.cpp/examples/llama.android/gradlew
          cat >> llama.cpp/examples/llama.android/gradle.properties <<'GP'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          GP

      - name: JVM tests and Java Kotlin compile
        working-directory: llama.cpp/examples/llama.android
        shell: bash
        env:
          RS_LLAMA_SRC: ${{ github.workspace }}/llama.cpp
        run: |
          set -euxo pipefail
          ./gradlew :rsapp:testDebugUnitTest :rsapp:compileDebugKotlin :rsapp:compileDebugJavaWithJavac --stacktrace --no-daemon

      - name: Verify core JVM behavior tests
        shell: bash
        run: |
          set -euxo pipefail
          DIR=llama.cpp/examples/llama.android/rsapp/build/test-results/testDebugUnitTest
          for cls in FileTypeResolverTest RsFileOperationQueueTest RsFilePreviewPolicyTest RsAgentToolRegistryTest RsAgentWorkspaceBehaviorTest; do
            XML="$DIR/TEST-com.rs.localstorage.$cls.xml"
            test -s "$XML"
            grep -q 'failures="0"' "$XML"
            grep -q 'errors="0"' "$XML"
            cp "$XML" "V477_${cls}.xml"
          done

      - name: Assemble 4.7.7 ARM64 APK
        working-directory: llama.cpp/examples/llama.android
        shell: bash
        env:
          RS_LLAMA_SRC: ${{ github.workspace }}/llama.cpp
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
        run: |
          set -euxo pipefail
          ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon

      - name: Re-run required behavioral gates after APK build
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/rsfile_v477_real_runtime_gate.mjs "$ROOT" | tee ../V477_RSFILE_REAL_RUNTIME_POSTBUILD.txt
          node scripts/rsfile_v472_required_gate.mjs "$ROOT" | tee ../V477_RSFILE_LEGACY_REGRESSION_POSTBUILD.txt
          node scripts/rs_v476_production_browser_gate.mjs "$ROOT" | tee ../V477_WEB_PRODUCTION_BROWSER_POSTBUILD.txt
          grep -q 'RSFILE_V477_REAL_RUNTIME_GATE=6/6' ../V477_RSFILE_REAL_RUNTIME_POSTBUILD.txt
          grep -q 'REQUIRED_GATE_PASS=12/12' ../V477_RSFILE_LEGACY_REGRESSION_POSTBUILD.txt
          grep -q 'RS_V476_PRODUCTION_BROWSER_GATE=PASS' ../V477_WEB_PRODUCTION_BROWSER_POSTBUILD.txt

      - name: Validate exact APK identity content and signing
        shell: bash
        run: |
          set -euxo pipefail
          APK=llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk
          OUT=RS-Storage-v4.7.7-arm64.apk
          test -s "$APK"
          test "$(stat -c '%s' "$APK")" -gt 30000000
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.rs.localstorage'" apk-badging.txt
          grep -q "versionCode='97'" apk-badging.txt
          grep -q "versionName='4.7.7'" apk-badging.txt
          grep -q "application-label:'RS Storage'" apk-badging.txt
          ABIS="$(unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u | xargs)"
          test "$ABIS" = "arm64-v8a"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libai-chat.so'
          ! unzip -l "$APK" | grep -q 'lib/x86_64/'
          unzip -l "$APK" | grep -q 'assets/rs-dynamic/app.js'
          unzip -l "$APK" | grep -q 'assets/rs-dynamic/rs-file-v477-workspace.js'
          unzip -l "$APK" | grep -q 'assets/rs-dynamic/rs-file-v477-workspace.css'
          unzip -p "$APK" assets/RS_BUILD_PROOF.txt | tee APK_BUILD_PROOF.txt
          grep -q '^Release=4.7.7$' APK_BUILD_PROOF.txt
          grep -q '^VersionCode=97$' APK_BUILD_PROOF.txt
          grep -q '^VersionCoherence=4.7.7-97$' APK_BUILD_PROOF.txt
          grep -q '^WebFileWorkspace=commandbar+popover-search+persistent-transfer-drawer$' APK_BUILD_PROOF.txt
          grep -q '^TransferUiOwnership=body-persistent-not-folder-dom$' APK_BUILD_PROOF.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee SHA256SUMS.txt
          stat -c '%s' "$OUT" | tee APK_SIZE_BYTES.txt
          printf 'version=4.7.7\nversionCode=97\nabi=arm64-v8a\nbase_commit=%s\npatch_commit=%s\nrunner=template-lab-public\nsigning=debug-apk\nreal_rsfile_gate=6/6\n' "$RS_STORAGE_BASE_COMMIT" "$RS_STORAGE_PATCH_COMMIT" | tee BUILD_REPORT.txt

      - name: Upload 4.7.7 APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: RS-Storage-v4.7.7-ARM64-PRODUCTION-AUDIT
          path: |
            RS-Storage-v4.7.7-arm64.apk
            SHA256SUMS.txt
            APK_SIZE_BYTES.txt
            BUILD_REPORT.txt
            apk-badging.txt
            apksigner.txt
            APK_BUILD_PROOF.txt
            V477_MATERIALIZE.txt
            V477_ANDROID_AUDIT.txt
            V477_WEB_AUDIT.txt
            V477_RSFILE_REAL_RUNTIME.txt
            V477_RSFILE_REAL_RUNTIME_POSTBUILD.txt
            V477_RSFILE_LEGACY_REGRESSION.txt
            V477_RSFILE_LEGACY_REGRESSION_POSTBUILD.txt
            V477_WEB_PRODUCTION_BROWSER.txt
            V477_WEB_PRODUCTION_BROWSER_POSTBUILD.txt
            V477_*.xml
          if-no-files-found: error
          retention-days: 30
