name: Build RS Local Storage V4.1.1 R5 Fixed APK
on:
  pull_request:
    branches: [ editor ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Reconstruct R4 source and apply R5 app fixes
        run: |
          set -euxo pipefail
          mkdir -p rs-local-storage-v41
          python3 - <<'PY'
          import base64,hashlib,pathlib,re
          expected='5187a6739125213e871661059630434fd10b53f42369319fa1e7496b20177d1a'
          ps=[re.sub(r'[^A-Za-z0-9+/=]','',pathlib.Path(f'rs-v41-part-{i:02d}').read_text(errors='ignore')) for i in range(7)]
          dec=lambda s: base64.b64decode(s+'='*((-len(s))%4),validate=False)
          ds=[None]*7
          for i in (0,2,3,4,5,6): ds[i]=dec(ps[i])
          cs=[ps[1]] if len(ps[1])==12000 else [ps[1][:p]+ps[1][p+1:] for p in range(len(ps[1]))] if len(ps[1])==12001 else []
          out=None
          for c in cs:
              try:x=ds[0]+dec(c)+b''.join(ds[2:])
              except Exception:continue
              if hashlib.sha256(x).hexdigest()==expected:out=x;break
          if out is None:raise SystemExit('reconstruction failed')
          pathlib.Path('/tmp/rs-v41.zip').write_bytes(out)
          PY
          unzip -t /tmp/rs-v41.zip
          unzip -q /tmp/rs-v41.zip -d rs-local-storage-v41
          cat r4-patch-part-* | base64 -d | gunzip > /tmp/r4.patch
          patch -p1 -d rs-local-storage-v41 < /tmp/r4.patch
          python3 - <<'PY'
          from pathlib import Path
          g=Path('rs-local-storage-v41/rsapp/build.gradle.kts')
          s=g.read_text()
          assert 'versionCode = 8' in s and 'versionName = "4.1.1-r4"' in s
          g.write_text(s.replace('versionCode = 8','versionCode = 9').replace('versionName = "4.1.1-r4"','versionName = "4.1.1-r5"'))
          p=Path('rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java')
          s=p.read_text()
          old='void cleanupSessions(){long now=System.currentTimeMillis();for(Map.Entry<String,Session>e:new ArrayList<>(sessions.entrySet()))if(e.getValue().expires<now){sessions.remove(e.getKey());streams.removeSession(e.getKey());}}'
          new='void cleanupSessions(){long now=System.currentTimeMillis();boolean changed=false;for(Map.Entry<String,Session>e:new ArrayList<>(sessions.entrySet()))if(e.getValue().expires<now){sessions.remove(e.getKey());streams.removeSession(e.getKey());changed=true;}if(changed)updateCounts();}'
          if s.count(old)!=1: raise SystemExit('session cleanup marker missing')
          s=s.replace(old,new)
          old='File dest=new File(dir,name),tmp=new File(dir,"."+name+".rsupload."+System.currentTimeMillis()+".part");if(dest.exists()){'
          new='File dest=new File(dir,name),tmp=new File(dir,"."+name+".rsupload."+System.currentTimeMillis()+".part");if(isProtectedLibraryStructure(dest))throw new SecurityException("A estrutura permanente da Biblioteca RS Media não pode ser substituída por upload.");if(dest.exists()){'
          if s.count(old)!=1: raise SystemExit('upload protection marker missing')
          p.write_text(s.replace(old,new))
          PY
          grep -q 'versionCode = 9' rs-local-storage-v41/rsapp/build.gradle.kts
          grep -q 'versionName = "4.1.1-r5"' rs-local-storage-v41/rsapp/build.gradle.kts
          grep -q 'A estrutura permanente da Biblioteca RS Media não pode ser substituída por upload' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          grep -q 'if(changed)updateCounts()' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          grep -q 'ensureDirectory(mediaRoot())' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MediaLibrary.java
      - name: Clone pinned llama.cpp and apply R5 runtime fixes
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp && git checkout 8ef78e644f559db4e8716b59bf76b8e11619337d && cd ..
          python3 - <<'PY'
          from pathlib import Path
          p=Path('llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt')
          s=p.read_text()
          a='                else -> throw IllegalStateException("Cannot unload model in ${state.javaClass.simpleName}")'
          b='''                is InferenceEngine.State.Initialized -> {\n                    Log.i(TAG, "No model loaded; cleanup skipped.")\n                    Unit\n                }\n\n                else -> throw IllegalStateException("Cannot unload model in ${state.javaClass.simpleName}")'''
          if s.count(a)!=1: raise SystemExit('cleanup marker missing')
          s=s.replace(a,b)
          a='''                is InferenceEngine.State.Error -> {\n                    Log.i(TAG, "Resetting error states...")\n                    _state.value = InferenceEngine.State.Initialized\n                    Log.i(TAG, "States reset!")\n                    Unit\n                }'''
          b='''                is InferenceEngine.State.Error -> {\n                    Log.i(TAG, "Releasing partial model resources after an error...")\n                    runCatching { unload() }.onFailure { Log.w(TAG, "Partial cleanup failed", it) }\n                    _readyForSystemPrompt = false\n                    _state.value = InferenceEngine.State.Initialized\n                    Log.i(TAG, "Error state reset and native resources released.")\n                    Unit\n                }'''
          if s.count(a)!=1: raise SystemExit('error cleanup marker missing')
          p.write_text(s.replace(a,b))
          p=Path('llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt')
          p.write_text(p.read_text().replace('class UnsupportedArchitectureException : Exception()','class UnsupportedArchitectureException : Exception("O modelo GGUF não é suportado por esta versão do runtime llama.cpp")'))
          p=Path('llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp')
          s=p.read_text().replace('constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;','constexpr int   DEFAULT_CONTEXT_SIZE    = 4096;').replace('constexpr int   BATCH_SIZE              = 512;','constexpr int   BATCH_SIZE              = 256;')
          a='''static llama_model                      * g_model;\nstatic llama_context                    * g_context;\nstatic llama_batch                        g_batch;\nstatic common_chat_templates_ptr          g_chat_templates;\nstatic common_sampler                   * g_sampler;'''
          b='''static llama_model                      * g_model = nullptr;\nstatic llama_context                    * g_context = nullptr;\nstatic llama_batch                        g_batch;\nstatic bool                               g_batch_initialized = false;\nstatic common_chat_templates_ptr          g_chat_templates;\nstatic common_sampler                   * g_sampler = nullptr;'''
          if s.count(a)!=1: raise SystemExit('native globals marker missing')
          s=s.replace(a,b)
          a='''    g_batch = llama_batch_init(BATCH_SIZE, 0, 1);\n    g_chat_templates = common_chat_templates_init(g_model, "");\n    g_sampler = new_sampler(DEFAULT_SAMPLER_TEMP);\n    return 0;'''
          b='''    g_batch = llama_batch_init(BATCH_SIZE, 0, 1);\n    g_batch_initialized = true;\n    g_chat_templates = common_chat_templates_init(g_model, "");\n    g_sampler = new_sampler(DEFAULT_SAMPLER_TEMP);\n    if (!g_sampler) { LOGe("%s: sampler initialization failed", __func__); return 2; }\n    return 0;'''
          if s.count(a)!=1: raise SystemExit('prepare marker missing')
          s=s.replace(a,b)
          a='''    // Reset long-term & short-term states\n    reset_long_term_states();\n    reset_short_term_states();\n\n    // Free up resources\n    common_sampler_free(g_sampler);\n    g_chat_templates.reset();\n    llama_batch_free(g_batch);\n    llama_free(g_context);\n    llama_model_free(g_model);'''
          b='''    chat_msgs.clear();\n    system_prompt_position = 0;\n    current_position = 0;\n    reset_short_term_states();\n    if (g_sampler) { common_sampler_free(g_sampler); g_sampler = nullptr; }\n    g_chat_templates.reset();\n    if (g_batch_initialized) { llama_batch_free(g_batch); g_batch_initialized = false; }\n    if (g_context) { llama_free(g_context); g_context = nullptr; }\n    if (g_model) { llama_model_free(g_model); g_model = nullptr; }'''
          if s.count(a)!=1: raise SystemExit('unload marker missing')
          s=s.replace(a,b)
          a='''    const int user_prompt_size = (int) user_tokens.size();\n    const int max_batch_size = DEFAULT_CONTEXT_SIZE - OVERFLOW_HEADROOM;\n    if (user_prompt_size > max_batch_size) {\n        const int skipped_tokens = user_prompt_size - max_batch_size;\n        user_tokens.resize(max_batch_size);\n        LOGw("%s: User prompt too long! Skipped %d tokens!", __func__, skipped_tokens);\n    }'''
          b='''    const int original_user_prompt_size = (int) user_tokens.size();\n    const int max_batch_size = DEFAULT_CONTEXT_SIZE - OVERFLOW_HEADROOM;\n    if (original_user_prompt_size > max_batch_size) {\n        const int skipped_tokens = original_user_prompt_size - max_batch_size;\n        user_tokens.resize(max_batch_size);\n        LOGw("%s: User prompt too long! Skipped %d tokens!", __func__, skipped_tokens);\n    }\n    const int processed_user_prompt_size = (int) user_tokens.size();'''
          if s.count(a)!=1: raise SystemExit('prompt accounting marker missing')
          s=s.replace(a,b)
          a='''    current_position += user_prompt_size;\n    stop_generation_position = current_position + user_prompt_size + n_predict;'''
          b='''    current_position += processed_user_prompt_size;\n    stop_generation_position = current_position + n_predict;'''
          if s.count(a)!=1: raise SystemExit('generation limit marker missing')
          p.write_text(s.replace(a,b))
          PY
          grep -q 'processed_user_prompt_size' llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'stop_generation_position = current_position + n_predict;' llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
      - name: Compile and build APK
        run: |
          cp -R rs-local-storage-v41/rsapp llama.cpp/examples/llama.android/rsapp
          printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts
          cd llama.cpp/examples/llama.android
          chmod +x gradlew
          ./gradlew :rsapp:compileDebugKotlin :rsapp:compileDebugJavaWithJavac --stacktrace --no-daemon
          ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.13113456 ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
      - name: Validate APK
        run: |
          set -euxo pipefail
          APK=llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='9'" /tmp/badging.txt
          grep -q "versionName='4.1.1-r5'" /tmp/badging.txt
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" RS-Local-Storage-v4.1.1-R5.apk
          sha256sum RS-Local-Storage-v4.1.1-R5.apk | tee RS-Local-Storage-v4.1.1-R5.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RS-Local-Storage-v4.1.1-R5-APK
          path: |
            RS-Local-Storage-v4.1.1-R5.apk
            RS-Local-Storage-v4.1.1-R5.sha256
          if-no-files-found: error
