name: Build RS Local Storage V4.1 AI Fix APK
on:
  pull_request:
    branches: [ editor ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Reconstruct and verify V4.1 source
        run: |
          set -euxo pipefail
          mkdir -p rs-local-storage-v41
          python3 - <<'PY'
          import base64, hashlib, pathlib, re
          expected = "5187a6739125213e871661059630434fd10b53f42369319fa1e7496b20177d1a"
          parts = []
          for i in range(7):
              raw = pathlib.Path(f"rs-v41-part-{i:02d}").read_text(encoding="utf-8", errors="ignore")
              clean = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
              parts.append(clean)
              print(f"part-{i:02d}: {len(clean)} chars")

          def decode(s):
              s = s + "=" * ((-len(s)) % 4)
              return base64.b64decode(s, validate=False)

          decoded = [None] * 7
          for i in (0, 2, 3, 4, 5, 6):
              decoded[i] = decode(parts[i])

          bad = parts[1]
          if len(bad) == 12000:
              candidates = [(None, bad)]
          elif len(bad) == 12001:
              candidates = [(pos, bad[:pos] + bad[pos+1:]) for pos in range(len(bad))]
          else:
              raise SystemExit(f"Unexpected part-01 length: {len(bad)}")

          solution = None
          repaired_pos = None
          for pos, cand in candidates:
              try:
                  b1 = decode(cand)
              except Exception:
                  continue
              out = decoded[0] + b1 + b"".join(decoded[2:])
              if hashlib.sha256(out).hexdigest() == expected:
                  solution = out
                  repaired_pos = pos
                  break

          if solution is None:
              raise SystemExit("Unable to reconstruct exact V4.1 ZIP from source chunks")
          print("repaired_pos", repaired_pos)
          print("zip bytes", len(solution))
          print("sha256", hashlib.sha256(solution).hexdigest())
          pathlib.Path("/tmp/rs-v41.zip").write_bytes(solution)
          PY
          unzip -t /tmp/rs-v41.zip
          unzip -q /tmp/rs-v41.zip -d rs-local-storage-v41
          test -f rs-local-storage-v41/rsapp/build.gradle.kts
          test -f rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/AiActivity.kt
          test -f rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/AiWebBridge.kt
          echo '=== RS AI calls in AiActivity.kt ==='
          grep -nE 'cleanUp|loadModel|InferenceEngine|state' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/AiActivity.kt || true
          echo '=== AiWebBridge.kt ==='
          nl -ba rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/AiWebBridge.kt | sed -n '1,320p'

      - name: Repair V4.1 Java source literal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java')
          s = p.read_text()
          bad = 'replace("' + chr(10) + '","<br>")'
          good = r'replace("\n","<br>")'
          count = s.count(bad)
          if count != 1:
              raise SystemExit(f'Expected exactly one broken newline literal, found {count}')
          s = s.replace(bad, good)
          p.write_text(s)
          if bad in s or good not in s:
              raise SystemExit('Java newline literal repair verification failed')
          print('Repaired HotspotServerService.java newline replacement literal')
          PY
          nl -ba rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java | sed -n '220,235p'

      - name: Clone pinned llama.cpp
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git checkout 8ef78e644f559db4e8716b59bf76b8e11619337d

      - name: Make model cleanup safe before first GGUF load
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt')
          s = p.read_text()
          needle = '                else -> throw IllegalStateException("Cannot unload model in ${state.javaClass.simpleName}")'
          replacement = '''                is InferenceEngine.State.Initialized -> {
                    // No model is loaded yet. Import/reload callers may safely request cleanup.
                    Log.i(TAG, "No model loaded; cleanup skipped.")
                    Unit
                }

                else -> throw IllegalStateException("Cannot unload model in ${state.javaClass.simpleName}")'''
          if s.count(needle) != 1:
              raise SystemExit(f'Expected one cleanup guard, found {s.count(needle)}')
          s = s.replace(needle, replacement)
          p.write_text(s)
          assert 'No model loaded; cleanup skipped.' in s
          print('Patched InferenceEngineImpl.cleanUp(): Initialized is now a safe no-op')
          PY

      - name: Inject RS Local Storage V4.1 module
        run: |
          cp -R rs-local-storage-v41/rsapp llama.cpp/examples/llama.android/rsapp
          printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts

      - name: Compile JVM sources
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :rsapp:compileDebugKotlin :rsapp:compileDebugJavaWithJavac --stacktrace --no-daemon

      - name: Build V4.1 AI Fix APK
        working-directory: llama.cpp/examples/llama.android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.13113456
        run: ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon

      - name: Inspect APK
        run: |
          set -euxo pipefail
          APK="llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 12
          cp "$APK" RS-Local-Storage-v4.1-AI-Fix.apk
          sha256sum RS-Local-Storage-v4.1-AI-Fix.apk
          unzip -t RS-Local-Storage-v4.1-AI-Fix.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: RS-Local-Storage-v4.1-AI-Fix-APK
          path: RS-Local-Storage-v4.1-AI-Fix.apk
          if-no-files-found: error
