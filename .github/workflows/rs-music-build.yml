name: Build RS Music UI V2 APK

on:
  pull_request:
    branches: [ editor ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rs-music-ui-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Template Lab
        uses: actions/checkout@v4

      - name: Checkout RS Music source
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Music-
          ref: feat/rs-music-ui-v2
          token: ${{ secrets.RS_MUSIC_READ_TOKEN }}
          path: rs-music

      - name: Apply motion UX patch
        run: python3 scripts/patch_rs_music_motion.py

      - name: Persist motion UX patch
        working-directory: rs-music
        shell: bash
        run: |
          git config user.name "RS Music CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/kotlin/com/mhglobal/rsmusic/MusicModel.kt app/src/main/kotlin/com/mhglobal/rsmusic/RsMusicFixedUi.kt app/src/main/kotlin/com/mhglobal/rsmusic/ToolsScreens.kt
          if git diff --cached --quiet; then
            echo "Motion UX patch already persisted"
          else
            git commit -m "feat: add finger-follow player motion and appearance controls"
            if git push origin HEAD:feat/rs-music-ui-v2; then
              echo "Motion UX patch pushed to source branch"
            else
              echo "WARNING: source token could not push; continuing with patched QA workspace"
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: rs-music/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Web Preview
        run: |
          test -s rs-music/web-preview/index.html
          test -s rs-music/netlify.toml
          grep -q "Lyrics Canvas" rs-music/web-preview/index.html
          grep -q "RS Music" rs-music/web-preview/index.html

      - name: Unit tests
        working-directory: rs-music
        run: |
          chmod +x gradlew
          ./gradlew :core:domain:test testDebugUnitTest --stacktrace

      - name: Android lint
        working-directory: rs-music
        run: ./gradlew lintDebug --stacktrace

      - name: Build QA APK
        working-directory: rs-music
        run: ./gradlew :app:assembleQa --stacktrace

      - name: Inspect APK
        run: |
          APK="$(find rs-music/app/build/outputs/apk/qa -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 12
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          cp "$APK" RS-Music-UI-v2-QA.apk
          sha256sum RS-Music-UI-v2-QA.apk > RS-Music-UI-v2-SHA256SUMS.txt
          cat RS-Music-UI-v2-SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RS-Music-UI-v2-APK
          path: |
            RS-Music-UI-v2-QA.apk
            RS-Music-UI-v2-SHA256SUMS.txt
            rs-music/app/build/reports/lint-results-debug.html
            rs-music/app/build/reports/tests/
          if-no-files-found: error
          retention-days: 14
