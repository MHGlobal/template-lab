name: Build RS Local Storage V4.1.1 R7 APK
on:
  pull_request:
    branches: [ editor ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain and workflow parser
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
          python3 -m pip install --disable-pip-version-check pyyaml
      - name: Reuse validated R6 source and runtime patch pipeline
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          wf=yaml.safe_load(Path('.github/workflows/rs-local-storage-v411-r6.yml').read_text())
          wanted={
              'Reconstruct source and apply R4/R5/R6 app fixes',
              'Clone pinned llama.cpp and apply hardened runtime fixes',
          }
          found=set()
          for step in wf['jobs']['build']['steps']:
              name=step.get('name')
              if name in wanted:
                  subprocess.run(['bash','-lc',step['run']],check=True)
                  found.add(name)
          missing=wanted-found
          if missing: raise SystemExit(f'R6 pipeline steps missing: {sorted(missing)}')
          PY
      - name: Apply R7 media preview UX hardening
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          g=Path('rs-local-storage-v41/rsapp/build.gradle.kts')
          gs=g.read_text()
          if 'versionCode = 10' not in gs or 'versionName = "4.1.1-r6"' not in gs:
              raise SystemExit('R6 version marker missing')
          g.write_text(gs.replace('versionCode = 10','versionCode = 11').replace('versionName = "4.1.1-r6"','versionName = "4.1.1-r7"'))

          p=Path('rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java')
          s=p.read_text()
          if "class='preview media-preview'" not in s or "class='preview audio-preview'" not in s:
              raise SystemExit('media preview markers missing')

          js="""function rsEnhanceMediaPreviews(){
          document.querySelectorAll('.media-preview img').forEach(img=>{
            if(img.dataset.rsEnhanced)return;img.dataset.rsEnhanced='1';
            const host=img.parentElement;host.classList.add('rs-image-host');
            const bar=document.createElement('div');bar.className='rs-image-toolbar';
            bar.innerHTML='<button type="button" data-z="out" aria-label="Reduzir zoom">−</button><button type="button" data-z="reset">100%</button><button type="button" data-z="in" aria-label="Aumentar zoom">+</button><button type="button" data-z="full" aria-label="Ecrã inteiro">⛶</button>';
            host.appendChild(bar);let scale=1,x=0,y=0,drag=false,px=0,py=0;
            const apply=()=>{img.style.transform=`translate(${x}px,${y}px) scale(${scale})`;bar.querySelector('[data-z="reset"]').textContent=Math.round(scale*100)+'%';host.classList.toggle('zoomed',scale>1)};
            const setScale=n=>{scale=Math.min(5,Math.max(1,n));if(scale===1){x=0;y=0}apply()};
            bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const z=b.dataset.z;if(z==='in')setScale(scale+.25);else if(z==='out')setScale(scale-.25);else if(z==='reset')setScale(1);else if(z==='full'){document.fullscreenElement?document.exitFullscreen():host.requestFullscreen&&host.requestFullscreen()}});
            host.addEventListener('wheel',e=>{e.preventDefault();setScale(scale+(e.deltaY<0?.2:-.2))},{passive:false});
            img.addEventListener('dblclick',()=>setScale(scale>1?1:2));
            img.addEventListener('pointerdown',e=>{if(scale<=1)return;drag=true;px=e.clientX;py=e.clientY;img.setPointerCapture&&img.setPointerCapture(e.pointerId)});
            img.addEventListener('pointermove',e=>{if(!drag)return;x+=e.clientX-px;y+=e.clientY-py;px=e.clientX;py=e.clientY;apply()});
            ['pointerup','pointercancel'].forEach(ev=>img.addEventListener(ev,()=>drag=false));apply();
          });
          document.querySelectorAll('.audio-preview audio').forEach(a=>{
            if(a.dataset.rsEnhanced)return;a.dataset.rsEnhanced='1';a.controls=false;a.classList.add('rs-audio-engine');
            const shell=document.createElement('div');shell.className='rs-audio-player';shell.innerHTML='<div class="rs-audio-art">♪</div><div class="rs-audio-main"><div class="rs-audio-title">RS MUSIC</div><input class="rs-audio-time" type="range" min="0" max="1000" value="0" aria-label="Posição da música"><div class="rs-audio-controls"><button type="button" data-a="back" aria-label="Retroceder 10 segundos">−10</button><button type="button" class="rs-audio-play" data-a="play" aria-label="Reproduzir">▶</button><button type="button" data-a="fwd" aria-label="Avançar 10 segundos">+10</button><span class="rs-audio-clock">0:00 / 0:00</span><button type="button" data-a="speed">1×</button><input class="rs-audio-vol" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume"></div></div>';
            a.parentElement.insertBefore(shell,a);const time=shell.querySelector('.rs-audio-time'),play=shell.querySelector('.rs-audio-play'),clock=shell.querySelector('.rs-audio-clock'),vol=shell.querySelector('.rs-audio-vol'),speed=shell.querySelector('[data-a="speed"]');let si=0;const speeds=[1,1.25,1.5,1.75,2,.75];
            const fmt=v=>{if(!isFinite(v))return'0:00';v=Math.max(0,Math.floor(v));const m=Math.floor(v/60),sec=v%60;return m+':'+String(sec).padStart(2,'0')};
            const sync=()=>{if(isFinite(a.duration)&&a.duration>0)time.value=Math.floor(a.currentTime/a.duration*1000);clock.textContent=fmt(a.currentTime)+' / '+fmt(a.duration);play.textContent=a.paused?'▶':'❚❚'};
            shell.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const act=b.dataset.a;if(act==='play'){if(a.paused){const r=a.play();r&&r.catch&&r.catch(()=>{})}else a.pause()}else if(act==='back')a.currentTime=Math.max(0,a.currentTime-10);else if(act==='fwd')a.currentTime=Math.min(a.duration||1e12,a.currentTime+10);else if(act==='speed'){si=(si+1)%speeds.length;a.playbackRate=speeds[si];speed.textContent=speeds[si]+'×'}sync()});
            time.addEventListener('input',()=>{if(isFinite(a.duration))a.currentTime=Number(time.value)/1000*a.duration});vol.addEventListener('input',()=>{a.volume=Number(vol.value)});['loadedmetadata','timeupdate','play','pause','ended','ratechange'].forEach(ev=>a.addEventListener(ev,sync));sync();
          });
          }
          document.addEventListener('DOMContentLoaded',rsEnhanceMediaPreviews);"""
          css=""".rs-image-host{position:relative;overflow:hidden;min-height:280px;display:grid;place-items:center;background:#050505;touch-action:none}.rs-image-host img{max-width:100%;max-height:72vh;transform-origin:center;transition:transform .12s ease;cursor:zoom-in;user-select:none;-webkit-user-drag:none}.rs-image-host.zoomed img{cursor:grab}.rs-image-host.zoomed img:active{cursor:grabbing}.rs-image-toolbar{position:absolute;z-index:4;right:14px;bottom:14px;display:flex;gap:6px;padding:6px;background:#0a0a0acc;border:1px solid #333;border-radius:13px;backdrop-filter:blur(10px)}.rs-image-toolbar button{border:0;background:#2a2a2a;color:#fff;border-radius:9px;min-width:40px;height:38px;font-weight:800}.rs-audio-engine{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.rs-audio-player{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center;padding:18px;background:linear-gradient(135deg,#21140f,#121212);border:1px solid #3a2b24;border-radius:18px}.rs-audio-art{width:88px;height:88px;border-radius:18px;background:linear-gradient(135deg,var(--o),#9a3100);display:grid;place-items:center;font-size:36px;font-weight:900;box-shadow:0 12px 34px #0008}.rs-audio-main{min-width:0}.rs-audio-title{font-size:10px;letter-spacing:.16em;color:#ff8a50;font-weight:900;margin-bottom:12px}.rs-audio-time{width:100%;accent-color:var(--o)}.rs-audio-controls{display:flex;align-items:center;gap:8px;margin-top:8px}.rs-audio-controls button{border:0;background:#2b2b2b;color:#fff;border-radius:10px;padding:9px 11px;font-weight:800}.rs-audio-controls .rs-audio-play{background:var(--o);width:44px;height:44px;border-radius:999px}.rs-audio-clock{font-size:11px;color:#aaa;margin-left:4px}.rs-audio-vol{width:90px;accent-color:#fff;margin-left:auto}@media(max-width:650px){.rs-audio-player{grid-template-columns:60px 1fr;padding:12px;gap:11px}.rs-audio-art{width:60px;height:60px;border-radius:14px;font-size:26px}.rs-audio-clock,.rs-audio-vol{display:none}.rs-image-toolbar{right:8px;bottom:8px}}"""

          def java_escape(x):
              return x.replace('\\','\\\\').replace('"','\\"').replace('\r','').replace('\n','')

          start=s.find('    String jsHelpers(){return "<script>')
          if start<0: raise SystemExit('jsHelpers start missing')
          end=s.find('</script>";}',start)
          if end<0: raise SystemExit('jsHelpers end missing')
          if 'rsEnhanceMediaPreviews' not in s[start:end]:
              s=s[:end]+java_escape(js)+s[end:]

          cstart=s.find('    String css(){return "<style>')
          if cstart<0: raise SystemExit('css start missing')
          cend=s.find('</style>";}',cstart)
          if cend<0: raise SystemExit('css end missing')
          if '.rs-audio-player{' not in s[cstart:cend]:
              s=s[:cend]+java_escape(css)+s[cend:]

          p.write_text(s)
          if 'rsEnhanceMediaPreviews' not in s or '.rs-image-toolbar{' not in s or '.rs-audio-player{' not in s:
              raise SystemExit('R7 media preview enhancement injection failed')
          PY
          grep -q 'versionCode = 11' rs-local-storage-v41/rsapp/build.gradle.kts
          grep -q 'versionName = "4.1.1-r7"' rs-local-storage-v41/rsapp/build.gradle.kts
          grep -q 'rsEnhanceMediaPreviews' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          grep -q 'isPermanentLibraryNode' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          grep -q 'ensureDirectory(mediaRoot())' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MediaLibrary.java
      - name: Compile and build APK
        run: |
          cp -R rs-local-storage-v41/rsapp llama.cpp/examples/llama.android/rsapp
          printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts
          cd llama.cpp/examples/llama.android
          chmod +x gradlew
          ./gradlew :rsapp:compileDebugKotlin :rsapp:compileDebugJavaWithJavac --stacktrace --no-daemon
          ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.13113456 ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
      - name: Validate APK
        run: |
          set -euxo pipefail
          APK=llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='11'" /tmp/badging.txt
          grep -q "versionName='4.1.1-r7'" /tmp/badging.txt
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" RS-Local-Storage-v4.1.1-R7.apk
          sha256sum RS-Local-Storage-v4.1.1-R7.apk | tee RS-Local-Storage-v4.1.1-R7.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RS-Local-Storage-v4.1.1-R7-APK
          path: |
            RS-Local-Storage-v4.1.1-R7.apk
            RS-Local-Storage-v4.1.1-R7.sha256
          if-no-files-found: error
