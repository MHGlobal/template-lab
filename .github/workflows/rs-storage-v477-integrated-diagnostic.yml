name: RS Storage 4.7.7 Integrated UI Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ rs-storage-v477-rebuild-runner ]
    paths: [ '.github/workflows/rs-storage-v477-integrated-diagnostic.yml' ]

permissions:
  contents: read

concurrency:
  group: rs-storage-v477-integrated-ui
  cancel-in-progress: true

jobs:
  diagnose-v477:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ROOT: source/current-v4.3.0
      LLAMA_REV: 8ef78e644f559db4e8716b59bf76b8e11619337d
      NDK_VERSION: 29.0.13113456
      CMAKE_VERSION: 3.31.6
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical 4.7.1 baseline
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: fix/v4.7-audit-blockers
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout 4.7.7 patch line
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: release/v4.7.7-ui-rsfile-rebuild
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: patch-src
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize integrated 4.7.7 UI
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/materialize_v471_release.sh
          mkdir -p scripts/v475_payload scripts/v476_payload
          for f in \
            apply_v472_fileop_isolation.py apply_v472_preview_policy.py apply_v472_folder_memory.py fix_v472_generated_literals.py audit_v472_release.py \
            apply_v473_professional_runtime.py apply_v473_tests.py audit_v473_professional_runtime.py \
            apply_v474_runtime_remediation.py apply_v474_tests.py apply_v474_compile_fix.py audit_v474_release.py \
            apply_v475_production_polish.py audit_v475_production.py \
            apply_v476_production_completion.py audit_v476_production.py \
            apply_v477_android_ui_rebuild.py apply_v477_android_product_shell.py audit_v477_android_ui.py \
            apply_v477_web_file_workspace.py fix_v477_web_file_workspace.py audit_v477_web_file_workspace.py \
            patch_v471_llama_cmake.py; do
            cp "../patch-src/scripts/$f" "scripts/$f"
          done
          cp ../patch-src/scripts/v475_payload/main.jsx scripts/v475_payload/main.jsx
          cp ../patch-src/scripts/v475_payload/style.css scripts/v475_payload/style.css
          cp ../patch-src/scripts/v476_payload/main.jsx scripts/v476_payload/main.jsx
          cp ../patch-src/scripts/v476_payload/style.css scripts/v476_payload/style.css
          scripts/materialize_v471_release.sh "$ROOT"
          python3 scripts/apply_v472_fileop_isolation.py "$ROOT"
          python3 scripts/apply_v472_preview_policy.py "$ROOT"
          python3 scripts/apply_v472_folder_memory.py "$ROOT"
          python3 scripts/fix_v472_generated_literals.py "$ROOT"
          python3 scripts/apply_v473_professional_runtime.py "$ROOT"
          python3 scripts/apply_v473_tests.py "$ROOT"
          python3 scripts/apply_v474_runtime_remediation.py "$ROOT"
          python3 scripts/apply_v474_tests.py "$ROOT"
          python3 scripts/apply_v474_compile_fix.py "$ROOT"
          python3 scripts/apply_v475_production_polish.py "$ROOT"
          python3 scripts/apply_v476_production_completion.py "$ROOT"
          python3 scripts/audit_v476_production.py "$ROOT"
          python3 scripts/apply_v477_android_ui_rebuild.py "$ROOT" | tee ../V477_ANDROID_STAGE1.txt
          python3 scripts/apply_v477_android_product_shell.py "$ROOT" | tee ../V477_ANDROID_SHELL.txt
          python3 scripts/audit_v477_android_ui.py "$ROOT" | tee ../V477_ANDROID_AUDIT.txt
          python3 scripts/apply_v477_web_file_workspace.py "$ROOT" | tee ../V477_WEB_STAGE1.txt
          python3 scripts/fix_v477_web_file_workspace.py "$ROOT" | tee ../V477_WEB_FIX.txt
          python3 scripts/audit_v477_web_file_workspace.py "$ROOT" | tee ../V477_WEB_AUDIT.txt
          grep -q 'V477_ANDROID_UI_AUDIT=18/18' ../V477_ANDROID_AUDIT.txt
          grep -q 'V477_WEB_FILE_AUDIT=18/18' ../V477_WEB_AUDIT.txt
          grep -q 'versionCode = 97' "$ROOT/rsapp/build.gradle.kts"
          grep -q 'versionName = "4.7.7"' "$ROOT/rsapp/build.gradle.kts"
      - name: Build Dynamic Web UI with 4.7.7 public workspace assets
        shell: bash
        run: |
          set -euxo pipefail
          npm --prefix private-src/$ROOT/dynamic-ui pkg set 'devDependencies.@vitejs/plugin-react=5.1.4'
          npm --prefix private-src/$ROOT/dynamic-ui install --no-audit --no-fund
          npm --prefix private-src/$ROOT/dynamic-ui run build
          test -s private-src/$ROOT/dynamic-ui/dist/app.js
          test -s private-src/$ROOT/dynamic-ui/dist/style.css
          test -s private-src/$ROOT/dynamic-ui/dist/rs-file-v477-workspace.js
          test -s private-src/$ROOT/dynamic-ui/dist/rs-file-v477-workspace.css
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - name: Prepare pinned llama.cpp Android tree
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp fetch --depth=1 origin "$LLAMA_REV"
          git -C llama.cpp checkout --detach "$LLAMA_REV"
          python3 private-src/scripts/apply_llama_rs_compat.py llama.cpp
          python3 private-src/scripts/apply_v434_load_progress.py llama.cpp
          python3 private-src/scripts/apply_v450_llama_runtime.py llama.cpp
          python3 private-src/scripts/patch_v471_llama_cmake.py llama.cpp
          rm -rf llama.cpp/examples/llama.android/rsapp
          cp -R private-src/$ROOT/rsapp llama.cpp/examples/llama.android/rsapp
          rm -rf llama.cpp/examples/llama.android/rsapp/src/main/assets/rs-dynamic
          mkdir -p llama.cpp/examples/llama.android/rsapp/src/main/assets/rs-dynamic
          cp -a private-src/$ROOT/dynamic-ui/dist/. llama.cpp/examples/llama.android/rsapp/src/main/assets/rs-dynamic/
          grep -q 'include(":rsapp")' llama.cpp/examples/llama.android/settings.gradle.kts || printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts
          chmod +x llama.cpp/examples/llama.android/gradlew
          cat >> llama.cpp/examples/llama.android/gradle.properties <<'GP'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          GP
      - name: Compile integrated Android and run JVM tests
        id: android_jvm
        continue-on-error: true
        working-directory: llama.cpp/examples/llama.android
        shell: bash
        env:
          RS_LLAMA_SRC: ${{ github.workspace }}/llama.cpp
        run: |
          set -o pipefail
          ./gradlew :rsapp:testDebugUnitTest :rsapp:compileDebugKotlin :rsapp:compileDebugJavaWithJavac --stacktrace --info --no-daemon 2>&1 | tee ../../../ANDROID_JVM_V477_INTEGRATED.log
      - name: Collect integrated diagnostics
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p v477-integrated/source v477-integrated/web v477-integrated/test-results
          cp ANDROID_JVM_V477_INTEGRATED.log v477-integrated/ || true
          cp V477_ANDROID_STAGE1.txt V477_ANDROID_SHELL.txt V477_ANDROID_AUDIT.txt V477_WEB_STAGE1.txt V477_WEB_FIX.txt V477_WEB_AUDIT.txt v477-integrated/ || true
          cp private-src/$ROOT/rsapp/src/main/java/com/rs/localstorage/MainActivity.java v477-integrated/source/ || true
          cp private-src/$ROOT/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java v477-integrated/source/ || true
          cp private-src/$ROOT/dynamic-ui/public/rs-file-v477-workspace.* v477-integrated/web/ || true
          if [ -d llama.cpp/examples/llama.android/rsapp/build/test-results ]; then cp -R llama.cpp/examples/llama.android/rsapp/build/test-results/. v477-integrated/test-results/; fi
          printf 'outcome=%s\npatch=%s\n' '${{ steps.android_jvm.outcome }}' "$(git -C patch-src rev-parse HEAD)" > v477-integrated/STATUS.txt
      - name: Upload integrated 4.7.7 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RS-Storage-v4.7.7-Integrated-UI-Diagnostic
          path: v477-integrated/**
          if-no-files-found: error
          retention-days: 7
      - name: Fail if integrated compile failed
        if: steps.android_jvm.outcome == 'failure'
        shell: bash
        run: exit 1
