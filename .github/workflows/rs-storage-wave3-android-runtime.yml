name: RS Storage Audit Wave 3 Android Runtime

on:
  workflow_dispatch:
  push:
    branches: [editor]
    paths:
      - '.github/workflows/rs-storage-wave3-android-runtime.yml'
      - 'audit/rsstorage_wave3_android_served_web.mjs'
      - 'reports/rs-storage-wave2-findings.md'

permissions:
  contents: read

env:
  TARGET_REF: release/v4.7.13-agent-harness
  STABILIZATION_REF: release/v4.7.13-agent-stabilization
  ROOT: target/source/current-v4.3.0

jobs:
  android-upgrade-served-web:
    name: Android upgrade + native visual + Android-served Web
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout Template Lab
        uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Checkout private target
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout private stabilization baseline
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.STABILIZATION_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: stabilization
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: android-actions/setup-android@v3
        with: { packages: '' }
      - name: Select native Android emulator ABI
        id: accel
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu runners used by this audit expose no /dev/kvm.
          # macos-14 is Apple Silicon and provides native ARM virtualization, so
          # use the matching Android ARM64 image instead of unsupported x86/ARM
          # software emulation on Linux.
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          echo 'arch=arm64-v8a' >> "$GITHUB_OUTPUT"
          echo 'target=google_apis' >> "$GITHUB_OUTPUT"
          echo 'software=false' >> "$GITHUB_OUTPUT"
      - name: Install Android and browser toolchains
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Build candidate and previous install with emulator ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-builds audit-out/android
          ABI='${{ steps.accel.outputs.arch }}'
          python3 - "$ABI" <<'PY'
          from pathlib import Path
          import sys
          abi=sys.argv[1]
          for p in [Path('target/source/current-v4.3.0/rsapp/build.gradle.kts'),Path('stabilization/source/current-v4.3.0/rsapp/build.gradle.kts')]:
              s=p.read_text(encoding='utf-8'); old='abiFilters += listOf("arm64-v8a")'; assert old in s, p; p.write_text(s.replace(old,f'abiFilters += listOf("{abi}")'),encoding='utf-8')
          PY
          mkdir -p external/llama.cpp
          git -C external/llama.cpp init
          git -C external/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C external/llama.cpp fetch --depth=1 origin 8ef78e644f559db4e8716b59bf76b8e11619337d
          git -C external/llama.cpp checkout --detach FETCH_HEAD
          python3 target/scripts/apply_llama_rs_compat.py external/llama.cpp
          python3 target/scripts/apply_v434_load_progress.py external/llama.cpp
          python3 target/scripts/apply_v450_llama_runtime.py external/llama.cpp
          SETTINGS=external/llama.cpp/examples/llama.android/settings.gradle.kts
          grep -q 'include(":rsapp")' "$SETTINGS" || printf '\ninclude(":rsapp")\n' >> "$SETTINGS"
          chmod +x external/llama.cpp/examples/llama.android/gradlew
          cp -R "$ROOT/rsapp" external/llama.cpp/examples/llama.android/rsapp
          cd external/llama.cpp/examples/llama.android
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456" ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
          CANDIDATE=$(find rsapp/build/outputs/apk/debug -type f -name '*.apk' | head -1); test -s "$CANDIDATE"; cp "$CANDIDATE" "$GITHUB_WORKSPACE/private-builds/candidate.apk"
          cd "$GITHUB_WORKSPACE"; rm -rf external/llama.cpp/examples/llama.android/rsapp; cp -R stabilization/source/current-v4.3.0/rsapp external/llama.cpp/examples/llama.android/rsapp
          cd external/llama.cpp/examples/llama.android
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456" ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
          PREVIOUS=$(find rsapp/build/outputs/apk/debug -type f -name '*.apk' | head -1); test -s "$PREVIOUS"; cp "$PREVIOUS" "$GITHUB_WORKSPACE/private-builds/previous.apk"
          cd "$GITHUB_WORKSPACE"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging private-builds/previous.apk | grep -E '^package:' > audit-out/android/previous-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging private-builds/candidate.apk | grep -E '^package:' > audit-out/android/candidate-badging.txt
          grep -q "versionName='4.7.0'" audit-out/android/previous-badging.txt; grep -q "versionName='4.7.13'" audit-out/android/candidate-badging.txt
          grep -q "versionCode='90'" audit-out/android/previous-badging.txt; grep -q "versionCode='103'" audit-out/android/candidate-badging.txt
      - name: Boot emulator and execute upgrade + real visual/runtime gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: ${{ steps.accel.outputs.arch }}
          target: ${{ steps.accel.outputs.target }}
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            OUT="$GITHUB_WORKSPACE/audit-out/android"; WEB="$GITHUB_WORKSPACE/audit-out/web-android-served"; OLD="$GITHUB_WORKSPACE/private-builds/previous.apk"; NEW="$GITHUB_WORKSPACE/private-builds/candidate.apk"; mkdir -p "$OUT" "$WEB"
            echo 'Installing previous production baseline without uninstall path...' | tee "$OUT/upgrade-evidence.txt"; adb install "$OLD" >/dev/null
            adb shell run-as com.rs.localstorage mkdir -p files
            printf 'upgrade-marker-%s\n' "$GITHUB_RUN_ID" | adb exec-out run-as com.rs.localstorage sh -c 'cat > files/rs-audit-preserve.txt'
            adb shell mkdir -p /sdcard/RSAgentWorkspace; adb shell "echo external-upgrade-marker-${GITHUB_RUN_ID} > /sdcard/RSAgentWorkspace/rs-audit-preserve.txt"
            echo 'Applying candidate with adb install -r (no uninstall)...' | tee -a "$OUT/upgrade-evidence.txt"; adb install -r "$NEW" >/dev/null
            adb shell dumpsys package com.rs.localstorage | grep -E 'versionName=|versionCode=' | head -4 | tee -a "$OUT/upgrade-evidence.txt"; adb shell dumpsys package com.rs.localstorage | grep -q 'versionName=4.7.13'
            adb exec-out run-as com.rs.localstorage cat files/rs-audit-preserve.txt | grep -q "upgrade-marker-${GITHUB_RUN_ID}"; adb shell cat /sdcard/RSAgentWorkspace/rs-audit-preserve.txt | grep -q "external-upgrade-marker-${GITHUB_RUN_ID}"
            echo 'UPGRADE_INTERNAL_DATA_PRESERVED=true' | tee -a "$OUT/upgrade-evidence.txt"; echo 'UPGRADE_EXTERNAL_WORKSPACE_PRESERVED=true' | tee -a "$OUT/upgrade-evidence.txt"
            adb shell pm grant com.rs.localstorage android.permission.POST_NOTIFICATIONS || true; adb shell pm grant com.rs.localstorage android.permission.NEARBY_WIFI_DEVICES || true
            adb shell am force-stop com.rs.localstorage; adb shell monkey -p com.rs.localstorage -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 5
            adb shell pidof com.rs.localstorage | tee "$OUT/pid.txt"; adb exec-out screencap -p > "$OUT/01-native-launch.png"
            adb shell dumpsys activity activities > "$OUT/activity.txt"; adb logcat -d -t 1000 | grep -E 'AndroidRuntime|FATAL EXCEPTION|com\.rs\.localstorage' > "$OUT/logcat-app-tail.txt" || true
            echo 'WAVE3_ANDROID_RUNTIME_GATES=PASS' | tee -a "$OUT/upgrade-evidence.txt"
      - name: Publish visual/runtime evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3-android-runtime-evidence
          path: |
            audit-out/android/
            audit-out/web-android-served/
          retention-days: 7
          if-no-files-found: warn
  wave3-gate:
    name: Wave 3 evidence gate
    if: always()
    needs: [android-upgrade-served-web]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce evidence job result
        shell: bash
        run: |
          set -euo pipefail
          echo "android-upgrade-served-web=${{ needs.android-upgrade-served-web.result }}"; test "${{ needs.android-upgrade-served-web.result }}" = success
          echo 'WAVE3_AUTOMATED_EVIDENCE=PASS'; echo 'FINAL_AUDIT_COMPLETE=NO — full Android/Web visual evidence, transfer/performance and physical Wi-Fi/hotspot gates remain mandatory.'