name: RS Storage Audit Wave 3 Android Runtime

on:
  workflow_dispatch:
  push:
    branches: [editor]
    paths:
      - '.github/workflows/rs-storage-wave3-android-runtime.yml'
      - 'audit/rsstorage_wave3_android_served_web.mjs'
      - 'reports/rs-storage-wave2-findings.md'

permissions:
  contents: read

env:
  TARGET_REF: release/v4.7.13-agent-harness
  STABILIZATION_REF: release/v4.7.13-agent-stabilization
  ROOT: target/source/current-v4.3.0

jobs:
  android-upgrade-served-web:
    name: Android upgrade + native visual + Android-served Web
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Template Lab
        uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Checkout private target
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout private stabilization baseline
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.STABILIZATION_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: stabilization
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo usermod -aG kvm "$USER" || true
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo '::error::/dev/kvm is unavailable on this public runner; hardware-accelerated Android runtime audit cannot start.'
            exit 1
          fi

      - name: Install Android and browser toolchains
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build candidate and previous install with the same debug signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-builds audit-out/android
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('target/source/current-v4.3.0/rsapp/build.gradle.kts'),Path('stabilization/source/current-v4.3.0/rsapp/build.gradle.kts')]:
              s=p.read_text(encoding='utf-8')
              old='abiFilters += listOf("arm64-v8a")'
              assert old in s, p
              p.write_text(s.replace(old,'abiFilters += listOf("x86_64")'),encoding='utf-8')
          PY
          mkdir -p external/llama.cpp
          git -C external/llama.cpp init
          git -C external/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C external/llama.cpp fetch --depth=1 origin 8ef78e644f559db4e8716b59bf76b8e11619337d
          git -C external/llama.cpp checkout --detach FETCH_HEAD
          python3 target/scripts/apply_llama_rs_compat.py external/llama.cpp
          python3 target/scripts/apply_v434_load_progress.py external/llama.cpp
          python3 target/scripts/apply_v450_llama_runtime.py external/llama.cpp
          SETTINGS=external/llama.cpp/examples/llama.android/settings.gradle.kts
          grep -q 'include(":rsapp")' "$SETTINGS" || printf '\ninclude(":rsapp")\n' >> "$SETTINGS"
          chmod +x external/llama.cpp/examples/llama.android/gradlew

          cp -R "$ROOT/rsapp" external/llama.cpp/examples/llama.android/rsapp
          cd external/llama.cpp/examples/llama.android
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456" ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
          CANDIDATE=$(find rsapp/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$CANDIDATE"
          cp "$CANDIDATE" "$GITHUB_WORKSPACE/private-builds/candidate.apk"
          cd "$GITHUB_WORKSPACE"

          rm -rf external/llama.cpp/examples/llama.android/rsapp
          cp -R stabilization/source/current-v4.3.0/rsapp external/llama.cpp/examples/llama.android/rsapp
          cd external/llama.cpp/examples/llama.android
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456" ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
          PREVIOUS=$(find rsapp/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$PREVIOUS"
          cp "$PREVIOUS" "$GITHUB_WORKSPACE/private-builds/previous.apk"
          cd "$GITHUB_WORKSPACE"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging private-builds/previous.apk | grep -E '^package:' > audit-out/android/previous-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging private-builds/candidate.apk | grep -E '^package:' > audit-out/android/candidate-badging.txt
          grep -q "versionName='4.7.0'" audit-out/android/previous-badging.txt
          grep -q "versionName='4.7.13'" audit-out/android/candidate-badging.txt
          grep -q "versionCode='90'" audit-out/android/previous-badging.txt
          grep -q "versionCode='103'" audit-out/android/candidate-badging.txt

      - name: Boot emulator and execute upgrade + real visual/runtime gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            OUT="$GITHUB_WORKSPACE/audit-out/android"
            WEB="$GITHUB_WORKSPACE/audit-out/web-android-served"
            OLD="$GITHUB_WORKSPACE/private-builds/previous.apk"
            NEW="$GITHUB_WORKSPACE/private-builds/candidate.apk"
            mkdir -p "$OUT" "$WEB"
            tap_ui() {
              local wanted="$1"
              adb shell uiautomator dump /sdcard/rs-audit-window.xml >/dev/null
              adb pull /sdcard/rs-audit-window.xml /tmp/rs-audit-window.xml >/dev/null
              local xy
              xy=$(python3 - "$wanted" <<'PY'
            import re,sys,xml.etree.ElementTree as ET
            wanted=sys.argv[1]
            root=ET.parse('/tmp/rs-audit-window.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')==wanted or n.attrib.get('content-desc')==wanted:
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                    if m:
                        x1,y1,x2,y2=map(int,m.groups());print((x1+x2)//2,(y1+y2)//2);raise SystemExit
            raise SystemExit(3)
            PY
              )
              adb shell input tap $xy
              sleep 1
            }
            echo 'Installing previous production baseline without uninstall path...' | tee "$OUT/upgrade-evidence.txt"
            adb install "$OLD" >/dev/null
            AUDIT_PASS="RsAudit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-A9!"
            export AUDIT_PASS
            python3 - <<'PY' >/tmp/rs_users.xml
            import base64,hashlib,os,secrets
            pw=os.environ['AUDIT_PASS'].encode(); salt=secrets.token_bytes(16); digest=hashlib.pbkdf2_hmac('sha256',pw,salt,180000,dklen=32)
            print('<?xml version="1.0" encoding="utf-8" standalone="yes" ?>'); print('<map>'); print('  <string name="admin_user">admin</string>'); print('  <string name="admin_salt">'+base64.b64encode(salt).decode()+'</string>'); print('  <string name="admin_hash">'+base64.b64encode(digest).decode()+'</string>'); print('</map>')
            PY
            cat >/tmp/rs_onboarding.xml <<'EOF'
            <?xml version="1.0" encoding="utf-8" standalone="yes" ?>
            <map><boolean name="v4710_exact_targets_done" value="true" /></map>
            EOF
            cat >/tmp/rs_ui.xml <<'EOF'
            <?xml version="1.0" encoding="utf-8" standalone="yes" ?>
            <map><boolean name="motion" value="false" /><boolean name="compact" value="false" /></map>
            EOF
            adb shell run-as com.rs.localstorage mkdir -p shared_prefs files
            printf 'upgrade-marker-%s\n' "$GITHUB_RUN_ID" | adb exec-out run-as com.rs.localstorage sh -c 'cat > files/rs-audit-preserve.txt'
            adb exec-out run-as com.rs.localstorage sh -c 'cat > shared_prefs/rs_users.xml' < /tmp/rs_users.xml
            adb exec-out run-as com.rs.localstorage sh -c 'cat > shared_prefs/rs_onboarding.xml' < /tmp/rs_onboarding.xml
            adb exec-out run-as com.rs.localstorage sh -c 'cat > shared_prefs/rs_ui.xml' < /tmp/rs_ui.xml
            adb shell mkdir -p /sdcard/RSAgentWorkspace
            adb shell "echo external-upgrade-marker-${GITHUB_RUN_ID} > /sdcard/RSAgentWorkspace/rs-audit-preserve.txt"
            echo 'Applying candidate with adb install -r (no uninstall)...' | tee -a "$OUT/upgrade-evidence.txt"
            adb install -r "$NEW" >/dev/null
            adb shell dumpsys package com.rs.localstorage | grep -E 'versionName=|versionCode=' | head -4 | tee -a "$OUT/upgrade-evidence.txt"
            adb shell dumpsys package com.rs.localstorage | grep -q 'versionName=4.7.13'
            adb exec-out run-as com.rs.localstorage cat files/rs-audit-preserve.txt | grep -q "upgrade-marker-${GITHUB_RUN_ID}"
            adb exec-out run-as com.rs.localstorage cat shared_prefs/rs_users.xml | grep -q 'admin_hash'
            adb shell cat /sdcard/RSAgentWorkspace/rs-audit-preserve.txt | grep -q "external-upgrade-marker-${GITHUB_RUN_ID}"
            echo 'UPGRADE_INTERNAL_DATA_PRESERVED=true' | tee -a "$OUT/upgrade-evidence.txt"
            echo 'UPGRADE_SHARED_PREFS_PRESERVED=true' | tee -a "$OUT/upgrade-evidence.txt"
            echo 'UPGRADE_EXTERNAL_WORKSPACE_PRESERVED=true' | tee -a "$OUT/upgrade-evidence.txt"
            adb shell pm grant com.rs.localstorage android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant com.rs.localstorage android.permission.NEARBY_WIFI_DEVICES || true
            adb shell appops set com.rs.localstorage MANAGE_EXTERNAL_STORAGE allow || true
            adb shell am force-stop com.rs.localstorage
            adb shell monkey -p com.rs.localstorage -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 4
            adb shell pidof com.rs.localstorage | tee "$OUT/pid.txt"
            adb exec-out screencap -p > "$OUT/01-native-server-stopped.png"
            adb shell uiautomator dump /sdcard/rs-native.xml >/dev/null || true
            adb pull /sdcard/rs-native.xml "$OUT/01-native-server-stopped.xml" >/dev/null || true
            tap_ui 'Ativar servidor'
            adb forward tcp:18080 tcp:8080
            ok=0
            for i in $(seq 1 75); do if curl -fsS --max-time 2 http://127.0.0.1:18080/login >/dev/null 2>&1; then ok=1; break; fi; sleep 1; done
            test "$ok" = 1
            echo 'ANDROID_EMBEDDED_SERVER_8080=true' | tee -a "$OUT/upgrade-evidence.txt"
            adb exec-out screencap -p > "$OUT/02-native-server-running.png"
            tap_ui 'Media'; adb exec-out screencap -p > "$OUT/03-native-media.png"
            tap_ui 'Clientes'; adb exec-out screencap -p > "$OUT/04-native-clients.png"
            tap_ui 'Acessos'; adb exec-out screencap -p > "$OUT/05-native-access.png"
            tap_ui 'Definições'; adb exec-out screencap -p > "$OUT/06-native-settings.png"
            tap_ui 'IA'; sleep 2; adb exec-out screencap -p > "$OUT/07-native-rsia.png"
            adb shell input keyevent 4 || true; sleep 1
            curl -sS -D /tmp/rs-login.headers -o /dev/null -X POST --data-urlencode 'u=admin' --data-urlencode "p=$AUDIT_PASS" http://127.0.0.1:18080/login
            RSSESSION=$(python3 - <<'PY'
            import re
            s=open('/tmp/rs-login.headers',encoding='utf-8',errors='ignore').read(); m=re.search(r'(?im)^Set-Cookie:\s*RSSESSION=([^;\r\n]+)',s)
            if not m: raise SystemExit(2)
            print(m.group(1))
            PY
            )
            echo "::add-mask::$RSSESSION"
            AUDIT_RSSESSION="$RSSESSION" node audit/rsstorage_wave3_android_served_web.mjs http://127.0.0.1:18080 "$WEB"
            adb shell uiautomator dump /sdcard/rs-final.xml >/dev/null || true
            adb pull /sdcard/rs-final.xml "$OUT/final-window.xml" >/dev/null || true
            adb shell dumpsys activity activities > "$OUT/activity.txt"
            adb logcat -d -t 1000 | grep -E 'AndroidRuntime|FATAL EXCEPTION|com\.rs\.localstorage' > "$OUT/logcat-app-tail.txt" || true
            test "$(find "$OUT" -name '*.png' | wc -l)" -ge 7
            test "$(find "$WEB" -name '*.png' | wc -l)" -ge 8
            echo 'WAVE3_ANDROID_RUNTIME_GATES=PASS' | tee -a "$OUT/upgrade-evidence.txt"

      - name: Publish visual/runtime evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave3-android-runtime-evidence
          path: |
            audit-out/android/
            audit-out/web-android-served/
          retention-days: 7
          if-no-files-found: warn

  wave3-gate:
    name: Wave 3 evidence gate
    if: always()
    needs: [android-upgrade-served-web]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce evidence job result
        shell: bash
        run: |
          set -euo pipefail
          echo "android-upgrade-served-web=${{ needs.android-upgrade-served-web.result }}"
          test "${{ needs.android-upgrade-served-web.result }}" = success
          echo 'WAVE3_AUTOMATED_EVIDENCE=PASS'
          echo 'FINAL_AUDIT_COMPLETE=NO — screenshots still require human visual review; transfer/performance and physical Wi-Fi/hotspot gates remain mandatory.'
