name: Build RS Local Storage V4.1 APK
on:
  pull_request:
    branches: [ editor ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Reconstruct RS Local Storage V4.1 source
        run: |
          set -euxo pipefail
          mkdir -p /tmp/rs-v41
          cat rs-v41-part-* | tr -d '\r\n' | base64 -d > /tmp/rs-v41.zip
          unzip -q /tmp/rs-v41.zip -d /tmp/rs-v41
          test -f /tmp/rs-v41/rsapp/build.gradle.kts
          test -f /tmp/rs-v41/rsapp/src/main/java/com/rs/localstorage/AiActivity.kt
          echo '=== AI STATE/LOAD/UNLOAD DIAGNOSTICS ==='
          grep -RniE 'unload|loadModel|Initialized|modelState|ModelState' /tmp/rs-v41/rsapp/src/main/java/com/rs/localstorage /tmp/rs-v41/rsapp/src/main 2>/dev/null || true
          echo '=== AiActivity.kt relevant region ==='
          nl -ba /tmp/rs-v41/rsapp/src/main/java/com/rs/localstorage/AiActivity.kt | sed -n '1,320p'

      - name: Clone pinned llama.cpp
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git checkout 8ef78e644f559db4e8716b59bf76b8e11619337d

      - name: Inject RS Local Storage V4.1 module
        run: |
          cp -R /tmp/rs-v41/rsapp llama.cpp/examples/llama.android/rsapp
          printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts

      - name: Build V4.1 APK
        working-directory: llama.cpp/examples/llama.android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.13113456
        run: |
          chmod +x gradlew
          ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon

      - name: Inspect APK
        run: |
          APK="llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 12
          cp "$APK" RS-Local-Storage-v4.1.apk
          sha256sum RS-Local-Storage-v4.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RS-Local-Storage-v4.1-APK
          path: RS-Local-Storage-v4.1.apk
          if-no-files-found: error
