name: Build RS Local Storage V4.1 APK
on:
  pull_request:
    branches: [ editor ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Decode and verify RS Local Storage V4.1 source
        run: |
          mkdir -p rs-local-storage-v41
          python3 - <<'PY'
          import base64, hashlib, pathlib, re
          files = [pathlib.Path(f"rs-v41-part-{i:02d}") for i in range(7)]
          out = bytearray()
          for p in files:
              raw = p.read_text(encoding="utf-8", errors="ignore")
              clean = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
              clean += "=" * ((-len(clean)) % 4)
              try:
                  chunk = base64.b64decode(clean, validate=False)
              except Exception as exc:
                  raise SystemExit(f"Cannot decode {p}: {exc}")
              print(p.name, "text", len(raw), "clean", len(clean), "bytes", len(chunk))
              out.extend(chunk)
          path = pathlib.Path("/tmp/rs-v41.zip")
          path.write_bytes(out)
          digest = hashlib.sha256(out).hexdigest()
          print("zip bytes", len(out))
          print("sha256", digest)
          expected = "5187a6739125213e871661059630434fd10b53f42369319fa1e7496b20177d1a"
          if digest != expected:
              raise SystemExit(f"Source SHA mismatch: expected {expected}, got {digest}")
          PY
          unzip -t /tmp/rs-v41.zip
          unzip -q /tmp/rs-v41.zip -d rs-local-storage-v41
          test -f rs-local-storage-v41/rsapp/build.gradle.kts

      - name: Clone pinned llama.cpp
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git checkout 8ef78e644f559db4e8716b59bf76b8e11619337d

      - name: Inject RS Local Storage V4.1 module
        run: |
          cp -R rs-local-storage-v41/rsapp llama.cpp/examples/llama.android/rsapp
          printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts

      - name: Build V4.1 APK
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :rsapp:assembleDebug --stacktrace

      - name: Inspect APK
        run: |
          APK="llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 8
          cp "$APK" RS-Local-Storage-v4.1.apk
          sha256sum RS-Local-Storage-v4.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RS-Local-Storage-v4.1-APK
          path: RS-Local-Storage-v4.1.apk
          if-no-files-found: error
