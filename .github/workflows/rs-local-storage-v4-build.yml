name: Build RS Local Storage V4 APK
on:
  pull_request:
    branches: [ editor ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" || true
      - name: Decode V4 source
        run: |
          mkdir -p /tmp/rs-v4
          cat v4/chunk* | base64 -d > /tmp/rs-v4/src.tar.gz
          tar -xzf /tmp/rs-v4/src.tar.gz -C /tmp/rs-v4
      - name: Clone pinned llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          git checkout 8ef78e644f559db4e8716b59bf76b8e11619337d
      - name: Inject RS V4 module
        run: |
          cp -R /tmp/rs-v4/rsapp /tmp/llama.cpp/examples/llama.android/rsapp
          printf '\ninclude(":rsapp")\n' >> /tmp/llama.cpp/examples/llama.android/settings.gradle.kts
      - name: Build V4 APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.13113456
        run: ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
      - name: Inspect APK
        run: |
          ls -lh /tmp/llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging /tmp/llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: RS-Local-Storage-v4-APK
          path: /tmp/llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk
          if-no-files-found: error
