# Runner only. Product source remains private; checkout and verify one immutable SHA.
name: RS Storage HTTPS ARM64 Public Runner
on:
  workflow_dispatch:
  push:
    branches: [rs-storage-v47-actions]
    paths: ['.github/workflows/rs-storage-v47-public-runner.yml']
env:
  RS_STORAGE_SOURCE_SHA: c19bfa30f84642a933a267b24471336b37d162d6
permissions:
  contents: read
concurrency:
  group: rs-storage-https-public
  cancel-in-progress: true
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify private-source token and pinned commit without exposing credentials
        env:
          RS_STORAGE_READ_TOKEN: ${{ secrets.RS_STORAGE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.error
          token=os.environ.get('RS_STORAGE_READ_TOKEN','')
          if not token:
              raise SystemExit('BLOCKED: configure RS_STORAGE_READ_TOKEN with Contents read access to MHGlobal/RS-Storage')
          url='https://api.github.com/repos/MHGlobal/RS-Storage/git/commits/'+os.environ['RS_STORAGE_SOURCE_SHA']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  print('Private source access: HTTP',response.status)
          except urllib.error.HTTPError as error:
              raise SystemExit('BLOCKED: private-source API returned HTTP '+str(error.code)+'. Renew/access-scope RS_STORAGE_READ_TOKEN; no private source will be published.')
          PY
  emulator:
    needs: access
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: c19bfa30f84642a933a267b24471336b37d162d6
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify pinned private product revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "c19bfa30f84642a933a267b24471336b37d162d6"
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: ''}
      - name: Public SDK for standalone TLS probe
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM for the hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AndroidKeyStore and TLS integration on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/rs_https_emulator_gate.sh
  powershell:
    needs: access
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: c19bfa30f84642a933a267b24471336b37d162d6
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify pinned private product revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "c19bfa30f84642a933a267b24471336b37d162d6"
      - name: Parse Windows HTTPS scripts
        shell: pwsh
        run: |
          foreach ($file in @('build_android_https.ps1','install_android_https_ca.ps1','check_android_https.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "scripts/$file"),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; throw "PowerShell parsing failed: $file" }
            Write-Host "PASS $file"
          }
      - name: Validate Windows CA enrollment without interactive trust-store writes
        shell: pwsh
        run: ./tests/https/TestWindowsCa.ps1
  contracts:
    needs: access
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: c19bfa30f84642a933a267b24471336b37d162d6
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify pinned private product revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "c19bfa30f84642a933a267b24471336b37d162d6"
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Live contracts, audio and existing RS IA/file regressions
        run: |
          python -m py_compile scripts/prepare_android_https_runtime.py
          python scripts/test_android_https.py
          python -m pip install -r requirements-live.txt
          python -m unittest discover -s tests -p 'test_rs_live_worker.py' -v
          node scripts/rs_live_audio_test.mjs
          python scripts/sync_rs_dynamic_assets.py --check
          python scripts/validate_rsia_runtime_js.py
          python scripts/validate_rsia_ui.py
          node source/current-v4.3.0/audit/inline-syntax.test.mjs
          node source/current-v4.3.0/audit/upload-queue.test.mjs
      - name: Live browser fixture (no physical microphone/model claim)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/rs_live_browser_gate.mjs
          node scripts/rs_file_embedding_search_browser_gate.mjs
      - uses: actions/upload-artifact@v4
        id: archive
        continue-on-error: true
        if: always()
        with:
          name: rs-https-contracts
          path: evidence/live-incremental-fixture/
      - name: Report optional evidence archive status
        if: always()
        run: |
          echo 'Contract and browser checks are reported above. Evidence upload: ${{ steps.archive.outcome }}. An upload failure does not mean these checks passed or failed; inspect their individual outcomes.' >> "$GITHUB_STEP_SUMMARY"
  android:
    needs: access
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: c19bfa30f84642a933a267b24471336b37d162d6
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify pinned private product revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "c19bfa30f84642a933a267b24471336b37d162d6"
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - uses: android-actions/setup-android@v3
        with: {packages: ''}
      - name: Toolchain and exact source pins (no model download)
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
          python scripts/prepare_android_https_runtime.py --runtime-root "$RUNNER_TEMP/rs-runtime" --sdk "$ANDROID_HOME"
          echo "RS_STORAGE_WORKSPACE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "RS_STORAGE_GRADLE_BUILD_ROOT=$RUNNER_TEMP/rs-build" >> "$GITHUB_ENV"
          echo "RS_STORAGE_JNI_LIBS=$RUNNER_TEMP/rs-runtime/jniLibs" >> "$GITHUB_ENV"
      - name: JVM and gateway gates before APK
        run: |
          set -euo pipefail
          gradle -p "$RUNNER_TEMP/rs-runtime/llama/examples/llama.android" -I "$GITHUB_WORKSPACE/scripts/rs_live_local.gradle" :rsapp:testDebugUnitTest --no-daemon --max-workers=2 --console=plain
          python scripts/rs_live_api_gate.py --output "$GITHUB_WORKSPACE/delivery-ci/api"
      - name: Build unsigned ARM64 candidate (independent of signing)
        run: |
          gradle -p "$RUNNER_TEMP/rs-runtime/llama/examples/llama.android" -I "$GITHUB_WORKSPACE/scripts/rs_live_local.gradle" :rsapp:assembleRelease --no-daemon --max-workers=2 --console=plain
      - name: Strict native dependency and APK gate
        run: |
          set -euo pipefail
          mkdir -p delivery-ci
          cp "$RUNNER_TEMP/rs-build/rsapp/outputs/apk/release/"*unsigned.apk delivery-ci/rs-storage-v4714-unsigned.apk
          python scripts/rs_live_apk_gate.py delivery-ci/rs-storage-v4714-unsigned.apk \
            --readelf "$ANDROID_HOME/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output delivery-ci/packaging.json
      - name: Sign only with the established release key when configured
        env:
          RS_ANDROID_KEYSTORE_B64: ${{ secrets.RS_ANDROID_KEYSTORE_B64 }}
          RS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RS_ANDROID_KEYSTORE_PASSWORD }}
          RS_ANDROID_KEY_ALIAS: ${{ secrets.RS_ANDROID_KEY_ALIAS }}
          RS_ANDROID_KEY_PASSWORD: ${{ secrets.RS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RS_ANDROID_KEYSTORE_B64:-}" ] || [ -z "${RS_ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${RS_ANDROID_KEY_ALIAS:-}" ] || [ -z "${RS_ANDROID_KEY_PASSWORD:-}" ]; then
            printf '{"status":"UNSIGNED","reason":"ORIGINAL_SIGNING_KEY_NOT_CONFIGURED","installable_update":false}\n' > delivery-ci/signing.json
          else
            keyfile="$(mktemp "${RUNNER_TEMP}/rs-https-keystore.XXXXXXXX")"
            trap 'rm -f "$keyfile"' EXIT
            chmod 600 "$keyfile"
            printf '%s' "$RS_ANDROID_KEYSTORE_B64" | base64 --decode > "$keyfile"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias "$RS_ANDROID_KEY_ALIAS" \
              --ks-pass env:RS_ANDROID_KEYSTORE_PASSWORD --key-pass env:RS_ANDROID_KEY_PASSWORD \
              --out delivery-ci/RS-Storage-v4.7.14-HTTPS-arm64-signed.apk delivery-ci/rs-storage-v4714-unsigned.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs delivery-ci/RS-Storage-v4.7.14-HTTPS-arm64-signed.apk > delivery-ci/apk-signature.txt
            python - <<'PY'
          import hashlib,json,pathlib,re
          apk=pathlib.Path('delivery-ci/RS-Storage-v4.7.14-HTTPS-arm64-signed.apk')
          text=pathlib.Path('delivery-ci/apk-signature.txt').read_text()
          matches=set(re.findall(r'certificate SHA-256 digest:\s*([0-9a-f]{64})',text,re.I))
          expected='fbbb9cb52f03e29a6ba94724c19a091e668b0879c64d00d26df208b63e8e964b'
          if {x.lower() for x in matches}!={expected}:
              apk.unlink()
              raise SystemExit('ORIGINAL_SIGNER_MISMATCH: signed candidate removed; no alternate key is allowed')
          pathlib.Path('delivery-ci/signing.json').write_text(json.dumps(dict(status='SIGNED_ORIGINAL_KEY',sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),signer_sha256=expected,physical='NOT_TESTED'),indent=2))
          PY
          fi
      - name: Record exact scope and physical blockers
        if: always()
        run: |
          mkdir -p delivery-ci
          python - <<'PY'
          import json,os,pathlib
          signing_path=pathlib.Path('delivery-ci/signing.json')
          signing=json.loads(signing_path.read_text()) if signing_path.exists() else dict(status='NOT_REACHED')
          print(json.dumps(dict(signing=signing),indent=2))
          pathlib.Path('delivery-ci/physical.json').write_text(json.dumps(dict(commit=os.environ['RS_STORAGE_SOURCE_SHA'],adb='BLOCKED_NO_DEVICE_ON_HOSTED_RUNNER',real_asr='BLOCKED_REAL_ANDROID_PROBE_PENDING',real_llm='NOT_TESTED',real_tts='BLOCKED_NO_COMPATIBLE_RUNTIME_ASSETS',embeddings='NOT_TESTED',signing=signing,release='BLOCKED'),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        id: archive
        continue-on-error: true
        if: always()
        with:
          name: rs-https-arm64-evidence-c19bfa30f846
          path: |
            delivery-ci/
            ${{ runner.temp }}/rs-build/rsapp/test-results/testDebugUnitTest/

          retention-days: 7
      - name: Report candidate archive status
        if: always()
        run: |
          echo 'APK archive: ${{ steps.archive.outcome }}. If storage quota blocks upload, no downloadable APK is delivered by this run. Physical rollout remains pending.' >> "$GITHUB_STEP_SUMMARY"
