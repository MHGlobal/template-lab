name: RS Remote Windows RC4.2 Runtime Gate

on:
  workflow_dispatch:
  push:
    branches: [ rs-remote-actions ]
    paths:
      - '.github/workflows/rs-remote-windows-runtime-hotfix.yml'
      - 'runner/rs-remote-windows-hotfix-request.txt'

permissions:
  contents: read

concurrency:
  group: rs-remote-windows-runtime-rc42
  cancel-in-progress: true

jobs:
  windows-runtime:
    name: Windows Host RC4.2 Build + Runtime Responsiveness
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public runner repository
        uses: actions/checkout@v4

      - name: Checkout private RS-Remote source
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Remote
          ref: build/public-runner
          token: ${{ secrets.RS_REMOTE_READ_TOKEN || secrets.RS_STORAGE_READ_TOKEN }}
          path: private-src
          persist-credentials: false

      - name: Verify requested source and rc4.2 runtime contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = (Get-Content 'runner/rs-remote-windows-hotfix-request.txt' -Raw).Trim()
          $actual = (git -C private-src rev-parse HEAD).Trim()
          if ([string]::IsNullOrWhiteSpace($expected)) { throw 'Missing requested RS-Remote hotfix commit' }
          if ($actual -ne $expected) { throw "Source mismatch. Expected $expected, got $actual" }
          $required = @(
            'private-src/source/windows/RSRemote.Host/MainWindow.Startup.cs',
            'private-src/source/windows/RSRemote.Host/HostDiagnostics.cs',
            'private-src/source/windows/RSRemote.Host/HostIconFactory.cs',
            'private-src/source/windows/RSRemote.Host/RSRemote.ico',
            'private-src/docs/RELEASE_MANIFEST_1.0.0-rc4.2.md'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing RC4.2 contract file: $path" } }

          $app = Get-Content 'private-src/source/windows/RSRemote.Host/App.xaml.cs' -Raw
          if ($app -notmatch 'DisableAutomaticStartup\(\)') { throw 'Legacy UI-thread startup is not disabled' }
          if ($app -notmatch '--safe-mode') { throw 'Safe mode missing' }
          if ($app -match 'GetAwaiter\(\)\.GetResult\(\)') { throw 'Blocking async wait remains in App' }
          if ($app -notmatch 'HostIconFactory\.CreateTrayIcon') { throw 'Tray is not using RS Remote icon' }
          if ($app -notmatch 'UiResponsivenessWatchdog') { throw 'UI watchdog missing' }

          $startup = Get-Content 'private-src/source/windows/RSRemote.Host/MainWindow.Startup.cs' -Raw
          if ($startup -notmatch 'Task\.Run\(BuildStartupBootstrap\)') { throw 'Host bootstrap is not off dispatcher' }
          if ($startup -notmatch 'WaitAsync\(TimeSpan\.FromSeconds\(20\)\)') { throw 'Startup bootstrap timeout gate missing' }

          $virtualDisplay = Get-Content 'private-src/source/windows/RSRemote.Host/VirtualDisplayComponent.cs' -Raw
          if ($virtualDisplay -match 'QueryPnPUtil') { throw 'Legacy synchronous PnP query remains' }
          if ($virtualDisplay -match 'GetAwaiter\(\)\.GetResult\(\)') { throw 'Blocking PnP wait remains' }
          if ($virtualDisplay -notmatch 'GetQuickStatus\(\)') { throw 'Nonblocking Virtual Display quick status missing' }
          if ($virtualDisplay -notmatch 'CancelAfter\(timeout\)') { throw 'PnP process timeout missing' }
          if ($virtualDisplay -notmatch 'Kill\(entireProcessTree: true\)') { throw 'Timed-out PnP process is not killed' }

          $virtualUi = Get-Content 'private-src/source/windows/RSRemote.Host/MainWindow.VirtualDisplay.cs' -Raw
          if ($virtualUi -match 'TryRestoreVirtualDisplayAsync') { throw 'Virtual Display autoactivation still exists' }
          if ($virtualUi -notmatch 'GetQuickStatus\(\)') { throw 'Virtual Display UI does not use quick status' }
          $render = [regex]::Match($virtualUi, 'protected override void OnContentRendered[\s\S]*?private void BuildVirtualDisplayUi').Value
          if ($render -match 'GetStatusAsync|ActivateAsync|pnputil') { throw 'Heavy Virtual Display work remains on OnContentRendered' }

          $main = Get-Content 'private-src/source/windows/RSRemote.Host/MainWindow.xaml.cs' -Raw
          if ($main -match 'Dispatcher\.Invoke\(') { throw 'Synchronous Dispatcher.Invoke remains' }
          if ($main -notmatch 'DecodeLatestCameraFramesAsync') { throw 'Background camera decode path missing' }

          $polisher = Get-Content 'private-src/source/windows/RSRemote.Host/HostDynamicVisualPolisher.cs' -Raw
          $identity = Get-Content 'private-src/source/windows/RSRemote.Host/HostBuildIdentity.cs' -Raw
          if ($polisher -match 'LayoutUpdated') { throw 'Visual polisher still polls LayoutUpdated' }
          if ($identity -match 'LayoutUpdated') { throw 'Build identity still polls LayoutUpdated' }

          $diag = Get-Content 'private-src/source/windows/RSRemote.Host/HostDiagnostics.cs' -Raw
          if ($diag -notmatch 'Channel\.CreateBounded') { throw 'Diagnostics logger is not queued off UI thread' }
          if ($diag -notmatch 'UiResponsivenessWatchdog') { throw 'UI watchdog implementation missing' }

          $project = Get-Content 'private-src/source/windows/RSRemote.Host/RSRemote.Host.csproj' -Raw
          if ($project -notmatch '<Version>1.0.0-rc4.2</Version>') { throw 'Windows Host rc4.2 version mismatch' }
          if ($project -notmatch '<ApplicationIcon>RSRemote\.ico</ApplicationIcon>') { throw 'Embedded EXE icon is not configured' }
          "RS_REMOTE_COMMIT=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore private-src/source/windows/RSRemote.sln --runtime win-x64

      - name: Build Release x64
        shell: pwsh
        run: dotnet build private-src/source/windows/RSRemote.sln --configuration Release --no-restore --verbosity normal

      - name: Run protocol media and transfer regressions
        shell: pwsh
        run: dotnet run --project private-src/source/windows/RSRemote.RegressionTests/RSRemote.RegressionTests.csproj --configuration Release

      - name: Publish self-contained single-file Host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish private-src/source/windows/RSRemote.Host/RSRemote.Host.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish/windows `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Validate embedded RS Remote executable icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'publish/windows/RSRemote.Host.exe').Path
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'Published EXE has no associated icon' }
          try {
            if ($icon.Width -lt 16 -or $icon.Height -lt 16) { throw "Associated icon is unexpectedly small: $($icon.Width)x$($icon.Height)" }
            Write-Host "Embedded icon validated: $($icon.Width)x$($icon.Height)"
          }
          finally { $icon.Dispose() }

      - name: Runtime smoke test normal GUI responsiveness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'publish/windows/RSRemote.Host.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          $seenWindow = $false
          $badStreak = 0
          try {
            for ($i = 0; $i -lt 48; $i++) {
              Start-Sleep -Milliseconds 250
              if ($process.HasExited) { throw "RS Remote Host exited during startup with code $($process.ExitCode)" }
              $process.Refresh()
              if ($process.MainWindowHandle -ne 0) { $seenWindow = $true }
              if ($process.Responding) { $badStreak = 0 } else { $badStreak++ }
              if ($badStreak -ge 8) { throw 'RS Remote Host remained Not Responding for at least 2 seconds during normal startup' }
            }
            if (-not $seenWindow) { throw 'RS Remote Host did not create a main window during normal smoke test' }
          }
          finally { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } }

      - name: Runtime smoke test safe mode responsiveness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 1
          $exe = (Resolve-Path 'publish/windows/RSRemote.Host.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--safe-mode' -PassThru
          $seenWindow = $false
          $badStreak = 0
          try {
            for ($i = 0; $i -lt 32; $i++) {
              Start-Sleep -Milliseconds 250
              if ($process.HasExited) { throw "RS Remote Host safe mode exited with code $($process.ExitCode)" }
              $process.Refresh()
              if ($process.MainWindowHandle -ne 0) { $seenWindow = $true }
              if ($process.Responding) { $badStreak = 0 } else { $badStreak++ }
              if ($badStreak -ge 8) { throw 'RS Remote Host remained Not Responding for at least 2 seconds in safe mode' }
            }
            if (-not $seenWindow) { throw 'RS Remote Host did not create a main window in safe mode' }
          }
          finally { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } }

      - name: Validate and stage standalone Host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'publish/windows/RSRemote.Host.exe'
          $out = 'RS-Remote-Host-v1.0.0-rc4.2-win-x64.exe'
          if (-not (Test-Path $source)) { throw "Expected $source" }
          $length = (Get-Item $source).Length
          if ($length -lt 20MB) { throw "Self-contained EXE unexpectedly small: $length bytes" }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $source)).ProductVersion
          if ($version -notlike '1.0.0-rc4.2*') { throw "Unexpected ProductVersion: $version" }
          Copy-Item $source $out
          Copy-Item 'private-src/docs/RELEASE_MANIFEST_1.0.0-rc4.2.md' 'RELEASE_MANIFEST_1.0.0-rc4.2.md'
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'SHA256SUMS-WINDOWS.txt' -Value "$hash  $out"
          Set-Content -Path 'WINDOWS_SIZE_BYTES.txt' -Value $length
          Set-Content -Path 'WINDOWS_BUILD_REPORT.txt' -Value @(
            'source_repo=MHGlobal/RS-Remote',
            'source_branch=build/public-runner',
            "source_commit=$env:RS_REMOTE_COMMIT",
            'productVersion=1.0.0-rc4.2',
            'runtimeSmoke=normal-responsive-12s,safe-mode-responsive-8s',
            'virtualDisplayStartup=on-demand-nonblocking',
            'dispatcherSyncInvoke=false',
            'layoutUpdatedPolling=false',
            'cameraDecode=latest-frame-background',
            'diagnostics=queued-background-logger,ui-watchdog',
            'embeddedApplicationIcon=true',
            'selfContained=true',
            'singleFile=true',
            'externalDotNetRuntimeRequired=false',
            'authenticodeSigned=false',
            'runner_repo=MHGlobal/template-lab',
            'runner_branch=rs-remote-actions'
          )

      - name: Upload Windows rc4.2 Host
        uses: actions/upload-artifact@v4
        with:
          name: RS-Remote-Windows-Host-v1.0.0-rc4.2-SelfContained
          path: |
            RS-Remote-Host-v1.0.0-rc4.2-win-x64.exe
            SHA256SUMS-WINDOWS.txt
            WINDOWS_SIZE_BYTES.txt
            WINDOWS_BUILD_REPORT.txt
            RELEASE_MANIFEST_1.0.0-rc4.2.md
          if-no-files-found: error
          retention-days: 30
