name: Fix RS Storage 4.7.11 Runner

on:
  push:
    branches: [ rs-storage-v4711-deep-audit-runner ]
    paths: [ '.github/workflows/fix-rs-storage-v4711-runner.yml' ]

permissions:
  contents: write

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rs-storage-v4711-deep-audit-runner
          fetch-depth: 0

      - name: Replace fragile patch application with fail-closed materialization
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rs-storage-v4711-deep-audit.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Apply reviewed audit remediation
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          git add -A
          git apply --3way --check ../patch-src/scripts/v4711-audit.patch
          git apply --3way ../patch-src/scripts/v4711-audit.patch
          node "$ROOT/audit/inline-syntax.test.mjs" "$ROOT"
          node "$ROOT/audit/upload-queue.test.mjs" "$ROOT"
          grep -q 'versionCode = 101' "$ROOT/rsapp/build.gradle.kts"
          grep -q 'versionName = "4.7.11"' "$ROOT/rsapp/build.gradle.kts"
'''
          new = '''      - name: Apply reviewed audit remediation deterministically
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          source = Path('../patch-src/scripts/v4711-audit.patch')
          target = Path('../v4711-audit-materialized.patch')
          lines = source.read_text(encoding='utf-8').splitlines(keepends=True)
          marker = '@@ -623,2 +649 @@ public class HotspotServerService extends Service {\\n'
          comment = ' // RS FILE 4.7.0 Stateful Explorer Overhaul: durable staged uploads, per-folder focus/scroll, reliable more/long-press, folder picker, list/grid, expanded local preview.\\n'
          out = []
          removed = 0
          i = 0
          while i < len(lines):
              if i + 2 < len(lines) and lines[i] == marker and lines[i + 1] == comment and lines[i + 2] == '-\\n':
                  removed += 1
                  i += 3
                  continue
              out.append(lines[i])
              i += 1
          if removed != 1:
              raise SystemExit(f'expected exactly one stale cosmetic hunk; removed={removed}')
          target.write_text(''.join(out), encoding='utf-8')
          print('V4711_PATCH_SANITIZED=1')
          PYCODE
          git add -A
          git apply --check ../v4711-audit-materialized.patch
          git apply ../v4711-audit-materialized.patch
          HOT="$ROOT/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java"
          grep -q 'openSockets=ConcurrentHashMap.newKeySet()' "$HOT"
          grep -q 'new ThreadPoolExecutor(12,12' "$HOT"
          grep -q 'Transfer-Encoding não suportado' "$HOT"
          grep -q 'RsAtomicUpload.stage' "$HOT"
          grep -q 'RsHttpRange.parse' "$HOT"
          grep -q 'RsWebEscapes.javascript' "$HOT"
          grep -q 'if(!"ERROR".equals(RUNTIME_STATE))' "$HOT"
          node "$ROOT/audit/inline-syntax.test.mjs" "$ROOT"
          node "$ROOT/audit/upload-queue.test.mjs" "$ROOT"
          grep -q 'versionCode = 101' "$ROOT/rsapp/build.gradle.kts"
          grep -q 'versionName = "4.7.11"' "$ROOT/rsapp/build.gradle.kts"
'''
          if old not in text:
              if 'Apply reviewed audit remediation deterministically' in text:
                  print('RUNNER_ALREADY_PATCHED=1')
                  raise SystemExit(0)
              raise SystemExit('expected remediation block not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('RUNNER_PATCHED=1')
          PY

      - name: Commit runner repair
        shell: bash
        run: |
          set -euxo pipefail
          if git diff --quiet -- .github/workflows/rs-storage-v4711-deep-audit.yml; then
            echo 'No runner change required.'
            exit 0
          fi
          git config user.name 'RS Storage CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/rs-storage-v4711-deep-audit.yml
          git commit -m 'ci: apply v4.7.11 audit patch deterministically'
          git push origin HEAD:rs-storage-v4711-deep-audit-runner
