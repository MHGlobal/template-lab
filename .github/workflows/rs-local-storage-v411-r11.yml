name: Build RS Local Storage V4.1.1 R11 APK
on:
  pull_request:
    branches: [ editor ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain and parser
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
          python3 -m pip install --disable-pip-version-check pyyaml
      - name: Reuse validated R10 source pipeline
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          wf=yaml.safe_load(Path('.github/workflows/rs-local-storage-v411-r10.yml').read_text())
          wanted=[
              'Reuse validated R9 source and runtime pipeline',
              'Apply R10 native Android navigation',
          ]
          steps={s.get('name'):s.get('run') for s in wf['jobs']['build']['steps'] if s.get('name')}
          for name in wanted:
              run=steps.get(name)
              if not run: raise SystemExit(f'R10 step missing: {name}')
              subprocess.run(['bash','-lc',run],check=True)
          PY
      - name: Apply R11 navigation UX and accessibility hardening
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          g=Path('rs-local-storage-v41/rsapp/build.gradle.kts')
          gs=g.read_text()
          if 'versionCode = 14' not in gs or 'versionName = "4.1.1-r10"' not in gs:
              raise SystemExit('R10 version marker missing')
          g.write_text(gs.replace('versionCode = 14','versionCode = 15').replace('versionName = "4.1.1-r10"','versionName = "4.1.1-r11"'))

          p=Path('rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MainActivity.java')
          s=p.read_text()
          marker='menu.setText("☰  Menu");menu.setAllCaps(false);'
          replacement='menu.setText("☰  Menu");menu.setAllCaps(false);menu.setContentDescription("Abrir menu de navegação");menu.setTooltipText("Navegação");'
          if marker not in s: raise SystemExit('R10 menu button marker missing')
          s=s.replace(marker,replacement,1)
          p.write_text(s)

          nav=Path('rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MainNavigation.java')
          ns=nav.read_text()
          required=[
              'GROUP_NATIVE',
              'GROUP_WEB',
              'setGroupDividerEnabled',
              'Abrir menu de navegação',
              'servidor parado',
              'announceForAccessibility',
              'File Storage · Web',
              'RS Cinema · Web',
          ]
          for item in required:
              if item not in ns: raise SystemExit(f'R11 navigation source marker missing: {item}')

          proof=Path('rs-local-storage-v41/rsapp/src/main/assets/RS_BUILD_PROOF.txt')
          previous=proof.read_text() if proof.exists() else ''
          previous=previous.replace('RS Local Storage V4.1.1 R10','RS Local Storage V4.1.1 R11')
          proof.write_text(previous+'AndroidNavigationR11=grouped+server-aware+a11y-announcements+tooltip\n')
          PY
          grep -q 'versionCode = 15' rs-local-storage-v41/rsapp/build.gradle.kts
          grep -q 'versionName = "4.1.1-r11"' rs-local-storage-v41/rsapp/build.gradle.kts
          grep -q 'Abrir menu de navegação' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MainActivity.java
          grep -q 'setGroupDividerEnabled' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MainNavigation.java
          grep -q 'announceForAccessibility' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MainNavigation.java
          grep -q 'isPermanentLibraryNode' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          grep -q 'ensureDirectory(mediaRoot())' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MediaLibrary.java
      - name: Compile and build R11 APK
        run: |
          cp -R rs-local-storage-v41/rsapp llama.cpp/examples/llama.android/rsapp
          printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts
          cd llama.cpp/examples/llama.android
          chmod +x gradlew
          ./gradlew :rsapp:compileDebugKotlin :rsapp:compileDebugJavaWithJavac --stacktrace --no-daemon
          ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.13113456 ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
      - name: Validate R11 APK and invariants
        run: |
          set -euxo pipefail
          APK=llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='15'" /tmp/badging.txt
          grep -q "versionName='4.1.1-r11'" /tmp/badging.txt
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/RS_BUILD_PROOF.txt > /tmp/rs-proof.txt
          cat /tmp/rs-proof.txt
          grep -q 'Biblioteca=non-destructive-protected' /tmp/rs-proof.txt
          grep -q 'AndroidNavigationR11=grouped+server-aware+a11y-announcements+tooltip' /tmp/rs-proof.txt
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              dex_names=[n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
              if not dex_names: raise SystemExit('No DEX files found in APK')
              dex=b''.join(z.read(n) for n in dex_names)
          for marker in (b'MainNavigation', b'File Storage', b'RS Cinema', b'Abrir menu de navega'):
              if marker not in dex: raise SystemExit(f'DEX marker missing: {marker!r}')
          print('R11 navigation and accessibility markers verified in packaged DEX')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" RS-Local-Storage-v4.1.1-R11.apk
          sha256sum RS-Local-Storage-v4.1.1-R11.apk | tee RS-Local-Storage-v4.1.1-R11.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RS-Local-Storage-v4.1.1-R11-APK
          path: |
            RS-Local-Storage-v4.1.1-R11.apk
            RS-Local-Storage-v4.1.1-R11.sha256
          if-no-files-found: error
