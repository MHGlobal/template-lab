name: RS Storage Audit Wave 4 Transfer Performance

on:
  workflow_dispatch:
  push:
    branches: [editor]
    paths:
      - '.github/workflows/rs-storage-wave4-transfer-performance.yml'
      - 'audit/rsstorage_wave4_transfer_runtime.sh'

concurrency:
  group: rs-storage-wave4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TARGET_REF: release/v4.7.13-agent-harness
  AUDIT_TARGET_SHA: 3b93d08a1b24d80fb392eaf26561ca3de685cf0e
  ROOT: target/source/current-v4.3.0

jobs:
  android-real-transfer-gates:
    name: Android real server transfer integrity + performance
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - name: Checkout Template Lab
        uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Checkout private target
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.AUDIT_TARGET_SHA }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build x86_64 candidate privately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-builds audit-out/wave4
          python3 - <<'PY'
          from pathlib import Path
          p=Path('target/source/current-v4.3.0/rsapp/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          old='abiFilters += listOf("arm64-v8a")'
          assert old in s
          p.write_text(s.replace(old,'abiFilters += listOf("x86_64")'),encoding='utf-8')
          PY
          mkdir -p external/llama.cpp
          git -C external/llama.cpp init
          git -C external/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C external/llama.cpp fetch --depth=1 origin 8ef78e644f559db4e8716b59bf76b8e11619337d
          git -C external/llama.cpp checkout --detach FETCH_HEAD
          python3 target/scripts/apply_llama_rs_compat.py external/llama.cpp
          python3 target/scripts/apply_v434_load_progress.py external/llama.cpp
          python3 target/scripts/apply_v450_llama_runtime.py external/llama.cpp
          # CI emulator optimization only: build the native library for x86_64 only.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('external/llama.cpp/examples/llama.android/lib/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          old='abiFilters += listOf("arm64-v8a", "x86_64")'
          assert old in s, p
          p.write_text(s.replace(old,'abiFilters += listOf("x86_64")'),encoding='utf-8')
          PY
          SETTINGS=external/llama.cpp/examples/llama.android/settings.gradle.kts
          grep -q 'include(":rsapp")' "$SETTINGS" || printf '\ninclude(":rsapp")\n' >> "$SETTINGS"
          cp -R "$ROOT/rsapp" external/llama.cpp/examples/llama.android/rsapp
          chmod +x external/llama.cpp/examples/llama.android/gradlew
          cd external/llama.cpp/examples/llama.android
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456" ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
          APK=$(find rsapp/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" "${{ github.workspace }}/private-builds/candidate.apk"
          cd "${{ github.workspace }}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging private-builds/candidate.apk | grep -q "versionName='4.7.13'"
          unzip -l private-builds/candidate.apk | grep -q 'lib/x86_64/'
          echo 'X86_64_APK_ABI=PASS' > audit-out/wave4/x86-abi.txt

      - name: Boot emulator and exercise real embedded transfer paths
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash "${{ github.workspace }}/audit/rsstorage_wave4_transfer_runtime.sh" "${{ github.workspace }}"
      - name: Extract sanitized metrics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-out/wave4-public
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('audit-out/wave4/runtime.log')
          text=src.read_text(errors='ignore') if src.exists() else ''
          pats=[
            r'UPLOAD_RAW_METRIC=[0-9. ]+',r'DOWNLOAD_RAW_METRIC=[0-9. ]+',r'RANGE_RAW_METRIC=[0-9. ]+',r'COPY_SECONDS=[0-9.]+',
            r'UPLOAD_HASH_MATCH=(?:true|false)',r'DOWNLOAD_HASH_MATCH=(?:true|false)',r'DOWNLOAD_TRACKING_COMPLETED=(?:true|false)',r'RANGE_206_HASH_MATCH=(?:true|false)',
            r'COPY_HASH_MATCH=(?:true|false)',r'MOVE_SOURCE_REMOVED=(?:true|false)',r'MOVE_HASH_MATCH=(?:true|false)',
            r'QUEUED_OR_ACTIVE_CANCEL_COMPLETED=(?:true|false)',r'CANCEL_PARTIAL_CLEANUP=(?:true|false)',
            r'SERVER_RESPONSIVE_AFTER_STRESS=(?:true|false)',r'WAVE4_[A-Z0-9_=-]+[^\n]*',
            r'PHYSICAL_WIFI_PERFORMANCE_GATE=[^\n]*',r'FINAL_AUDIT_COMPLETE=[^\n]*'
          ]
          found=[]
          for p in pats:
            for m in re.finditer(p,text):
              x=m.group(0).strip()
              if x not in found: found.append(x)
          Path('audit-out/wave4-public/metrics.txt').write_text('\n'.join(found)+'\n')
          PY
          cat audit-out/wave4-public/metrics.txt

      - name: Publish sanitized transfer evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave4-sanitized-transfer-evidence
          path: audit-out/wave4-public/
          retention-days: 7
          if-no-files-found: warn

  wave4-gate:
    name: Wave 4 automated transfer gate
    if: always()
    needs: [android-real-transfer-gates]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          echo "android-real-transfer-gates=${{ needs.android-real-transfer-gates.result }}"
          test "${{ needs.android-real-transfer-gates.result }}" = success
          echo 'WAVE4_AUTOMATED_TRANSFER_GATE=PASS'
          echo 'FINAL_AUDIT_COMPLETE=NO — physical Wi-Fi/hotspot throughput remains mandatory.'
