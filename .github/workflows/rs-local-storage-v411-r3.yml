name: Build RS Local Storage V4.1.1 R3 APK

on:
  pull_request:
    branches: [ editor ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Reconstruct and patch V4.1.1 R3
        run: |
          set -euxo pipefail
          mkdir -p rs-local-storage-v41
          python3 - <<'PY'
          import base64,hashlib,pathlib,re
          expected='5187a6739125213e871661059630434fd10b53f42369319fa1e7496b20177d1a'
          ps=[re.sub(r'[^A-Za-z0-9+/=]','',pathlib.Path(f'rs-v41-part-{i:02d}').read_text(errors='ignore')) for i in range(7)]
          dec=lambda s: base64.b64decode(s+'='*((-len(s))%4),validate=False)
          ds=[None]*7
          for i in (0,2,3,4,5,6): ds[i]=dec(ps[i])
          cs=[ps[1]] if len(ps[1])==12000 else [ps[1][:p]+ps[1][p+1:] for p in range(len(ps[1]))] if len(ps[1])==12001 else []
          out=None
          for c in cs:
              try:x=ds[0]+dec(c)+b''.join(ds[2:])
              except:continue
              if hashlib.sha256(x).hexdigest()==expected:out=x;break
          if out is None:raise SystemExit('reconstruction failed')
          pathlib.Path('/tmp/rs-v41.zip').write_bytes(out)
          PY
          unzip -t /tmp/rs-v41.zip
          unzip -q /tmp/rs-v41.zip -d rs-local-storage-v41
          python3 - <<'PY'
          from pathlib import Path
          root=Path('rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage')
          p=root/'HotspotServerService.java';t=p.read_text();bad='replace("'+chr(10)+'","<br>")';good=r'replace("\n","<br>")'
          if t.count(bad)!=1:raise SystemExit('newline patch missing')
          t=t.replace(bad,good)
          a='void protectRoot(File f)throws Exception{if(f.getCanonicalFile().equals(storageRoot().getCanonicalFile()))throw new SecurityException();}'
          b='boolean isProtectedLibraryStructure(File f)throws Exception{File c=f.getCanonicalFile(),media=library.mediaRoot().getCanonicalFile(),movies=library.moviesRoot().getCanonicalFile(),series=library.seriesRoot().getCanonicalFile(),meta=new File(media,".rs").getCanonicalFile();return c.equals(media)||c.equals(movies)||c.equals(series)||c.equals(meta);}\n    void protectRoot(File f)throws Exception{File c=f.getCanonicalFile();if(c.equals(storageRoot().getCanonicalFile()))throw new SecurityException("A raiz do armazenamento é protegida");if(isProtectedLibraryStructure(c))throw new SecurityException("A estrutura da Biblioteca RS Media é permanente e não pode ser apagada, copiada, movida ou renomeada");}'
          if t.count(a)!=1:raise SystemExit('protect patch missing')
          t=t.replace(a,b)
          a='append("\' data-download=\'").append(attr(dl)).append("\' data-csrf=\'").append(attr(s.csrf)).append("\'><span class=\'type ")'
          b='append("\' data-download=\'").append(attr(dl)).append("\' data-csrf=\'").append(attr(s.csrf)).append("\' data-protected=\'").append(isProtectedLibraryStructure(f)?"1":"0").append("\'><span class=\'type ")'
