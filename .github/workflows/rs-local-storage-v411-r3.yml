      - name: Verify R3 invariants
        run: |
          grep -q 'versionCode = 7' rs-local-storage-v41/rsapp/build.gradle.kts
          grep -q 'isProtectedLibraryStructure' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          grep -q 'navigator.sendBeacon' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          grep -q 'Permissions-Policy' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          grep -q 'ensureDirectory(mediaRoot())' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/MediaLibrary.java
          grep -q 'g_batch_initialized = false' llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
      - name: Inject module and compile
        run: |
          cp -R rs-local-storage-v41/rsapp llama.cpp/examples/llama.android/rsapp
          printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts
          cd llama.cpp/examples/llama.android
          chmod +x gradlew
          ./gradlew :rsapp:compileDebugKotlin :rsapp:compileDebugJavaWithJavac --stacktrace --no-daemon
          ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.13113456 ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
      - name: Validate APK integrity and signature
        run: |
          set -euxo pipefail
          APK="llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='7'" /tmp/badging.txt
          grep -q "versionName='4.1.1-r3'" /tmp/badging.txt
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" RS-Local-Storage-v4.1.1-R3.apk
          sha256sum RS-Local-Storage-v4.1.1-R3.apk | tee RS-Local-Storage-v4.1.1-R3.sha256
      - uses: actions/upload-artifact@v4
