name: Export NDK Host Runtime

on:
  push:
    branches:
      - lab/export-android-toolchain
    paths:
      - ".github/workflows/export-ndk-host-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve sdkmanager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
      - name: Install pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.sdk.outputs.sdkmanager }}" "ndk;26.1.10909125" >/dev/null
      - name: Pack host runtime
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          PRE="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          ROOT="$RUNNER_TEMP/ndk-host-runtime"
          DEST="$ROOT/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p "$DEST" "$ROOT/ndk/build"
          cp -a "$NDK/build/cmake" "$ROOT/ndk/build/"

          echo "clang dependencies:"
          ldd "$PRE/bin/clang" | tee "$RUNNER_TEMP/clang-ldd.txt"
          while IFS= read -r dep; do
            case "$dep" in
              "$PRE"/*)
                rel="${dep#$PRE/}"
                mkdir -p "$DEST/$(dirname "$rel")"
                cp -L "$dep" "$DEST/$rel"
                ;;
            esac
          done < <(ldd "$PRE/bin/clang" | awk '/=>/ && $3 ~ /^\// {print $3}')

          find "$PRE" -maxdepth 2 \( -type f -o -type l \) -name 'libc++*.so*' -print | while read -r dep; do
            rel="${dep#$PRE/}"
            mkdir -p "$DEST/$(dirname "$rel")"
            cp -L "$dep" "$DEST/$rel"
          done
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/ndk-host-runtime.tar.gz" ndk-host-runtime
          du -sh "$ROOT"
          ls -lh "$RUNNER_TEMP/ndk-host-runtime.tar.gz"
          sha256sum "$RUNNER_TEMP/ndk-host-runtime.tar.gz" > "$RUNNER_TEMP/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ndk-host-runtime
          path: |
            ${{ runner.temp }}/ndk-host-runtime.tar.gz
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/clang-ldd.txt
          retention-days: 2
          compression-level: 0
