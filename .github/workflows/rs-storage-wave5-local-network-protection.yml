name: RS Storage Audit Wave 5 Local Network Protection

on:
  workflow_dispatch:
  push:
    branches: [editor]
    paths:
      - '.github/workflows/rs-storage-wave5-local-network-protection.yml'
      - 'audit/RsLocalNetworkPolicyContractTest.java'

permissions:
  contents: read

env:
  TARGET_REF: release/v4.7.13-agent-harness
  ROOT: target/source/current-v4.3.0

jobs:
  production-network-policy-contract:
    name: Production network policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Compile the actual production policy with the public contract harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs-network-classes
          javac -d /tmp/rs-network-classes \
            "$ROOT/rsapp/src/main/java/com/rs/localstorage/RsLocalNetworkPolicy.java" \
            audit/RsLocalNetworkPolicyContractTest.java
          java -cp /tmp/rs-network-classes com.rs.localstorage.RsLocalNetworkPolicyContractTest
      - name: Record compatibility-risk markers without publishing source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          policy=Path('target/source/current-v4.3.0/rsapp/src/main/java/com/rs/localstorage/RsLocalNetworkPolicy.java').read_text(encoding='utf-8')
          discovery=Path('target/source/current-v4.3.0/rsapp/src/main/java/com/rs/localstorage/LocalDiscoveryManager.java').read_text(encoding='utf-8')
          main=Path('target/source/current-v4.3.0/rsapp/src/main/java/com/rs/localstorage/MainActivity.java').read_text(encoding='utf-8')
          assert 'return sameSubnet(remote, local, 24);' in policy
          assert 'interfaceScore(name)' in discovery and 'selectBestAddress()' in discovery
          assert 'if(nearbyMissing)toast(' in main and 'startServerAfterPermissions();' in main
          print('NETWORK_RISK_PREFIX_FALLBACK_24=true')
          print('NETWORK_RISK_MDNS_SINGLE_HEURISTIC_INTERFACE=true')
          print('DENIED_NEARBY_CALLBACK_CAN_START_SERVER=true')
          print('PHYSICAL_NETWORK_GATE=NOT_RUN')
          PY

  android16-lnp-real-uid:
    name: Android 16 LNP app-UID enforcement + denied permission behavior
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Build x86_64 candidate privately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-builds audit-out/wave5
          python3 - <<'PY'
          from pathlib import Path
          p=Path('target/source/current-v4.3.0/rsapp/build.gradle.kts')
          s=p.read_text(encoding='utf-8'); old='abiFilters += listOf("arm64-v8a")'; assert old in s
          p.write_text(s.replace(old,'abiFilters += listOf("x86_64")'),encoding='utf-8')
          PY
          mkdir -p external/llama.cpp
          git -C external/llama.cpp init
          git -C external/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C external/llama.cpp fetch --depth=1 origin 8ef78e644f559db4e8716b59bf76b8e11619337d
          git -C external/llama.cpp checkout --detach FETCH_HEAD
          python3 target/scripts/apply_llama_rs_compat.py external/llama.cpp
          python3 target/scripts/apply_v434_load_progress.py external/llama.cpp
          python3 target/scripts/apply_v450_llama_runtime.py external/llama.cpp
          # CI emulator optimization only: build the native library for x86_64 only.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('external/llama.cpp/examples/llama.android/lib/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          old='abiFilters += listOf("arm64-v8a", "x86_64")'
          assert old in s, p
          p.write_text(s.replace(old,'abiFilters += listOf("x86_64")'),encoding='utf-8')
          PY
          SETTINGS=external/llama.cpp/examples/llama.android/settings.gradle.kts
          grep -q 'include(":rsapp")' "$SETTINGS" || printf '\ninclude(":rsapp")\n' >> "$SETTINGS"
          cp -R "$ROOT/rsapp" external/llama.cpp/examples/llama.android/rsapp
          chmod +x external/llama.cpp/examples/llama.android/gradlew
          cd external/llama.cpp/examples/llama.android
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456" ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
          APK=$(find rsapp/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" "${{ github.workspace }}/private-builds/candidate.apk"
          cd "${{ github.workspace }}"
          unzip -l private-builds/candidate.apk | grep -q 'lib/x86_64/'
          echo 'X86_64_APK_ABI=PASS' > audit-out/wave5/x86-abi.txt

      - name: Exercise Android 16 local-network protections with the app UID
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: |
            set -euo pipefail
            OUT="${{ github.workspace }}/audit-out/wave5"
            mkdir -p "$OUT"
            exec > >(tee "$OUT/lnp-runtime.log") 2>&1

            wait_boot() {
              adb wait-for-device
              for ((i=1;i<=120;i++)); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && return 0; sleep 1; done
              return 1
            }
            tap_text() {
              local wanted="$1"
              adb shell uiautomator dump /sdcard/rs-wave5.xml >/dev/null
              adb pull /sdcard/rs-wave5.xml /tmp/rs-wave5.xml >/dev/null
              local xy
              xy=$(python3 - "$wanted" <<'PY'
            import re,sys,xml.etree.ElementTree as ET
            wanted=sys.argv[1].lower()
            root=ET.parse('/tmp/rs-wave5.xml').getroot()
            for n in root.iter('node'):
                text=(n.attrib.get('text') or n.attrib.get('content-desc') or '').lower()
                if text==wanted or wanted in text:
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                    if m:
                        x1,y1,x2,y2=map(int,m.groups()); print((x1+x2)//2,(y1+y2)//2); raise SystemExit
            raise SystemExit(3)
            PY
              )
              adb shell input tap $xy
              sleep 1
            }

            adb install "${{ github.workspace }}/private-builds/candidate.apk" >/dev/null
            AUDIT_PASS="RsLnp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-C5!"
            export AUDIT_PASS
            python3 - <<'PY' >/tmp/rs_users.xml
            import base64,hashlib,os,secrets
            salt=secrets.token_bytes(16)
            digest=hashlib.pbkdf2_hmac('sha256',os.environ['AUDIT_PASS'].encode(),salt,180000,dklen=32)
            print('<?xml version="1.0" encoding="utf-8" standalone="yes" ?>')
            print('<map><string name="admin_user">admin</string><string name="admin_salt">'+base64.b64encode(salt).decode()+'</string><string name="admin_hash">'+base64.b64encode(digest).decode()+'</string></map>')
            PY
            cat >/tmp/rs_onboarding.xml <<'EOF'
            <?xml version="1.0" encoding="utf-8" standalone="yes" ?>
            <map><boolean name="v4710_exact_targets_done" value="true" /></map>
            EOF
            adb shell run-as com.rs.localstorage mkdir -p shared_prefs
            adb exec-out run-as com.rs.localstorage sh -c 'cat > shared_prefs/rs_users.xml' < /tmp/rs_users.xml
            adb exec-out run-as com.rs.localstorage sh -c 'cat > shared_prefs/rs_onboarding.xml' < /tmp/rs_onboarding.xml
            adb shell appops set com.rs.localstorage MANAGE_EXTERNAL_STORAGE allow || true
            adb shell pm grant com.rs.localstorage android.permission.POST_NOTIFICATIONS || true

            adb shell am compat enable RESTRICT_LOCAL_NETWORK com.rs.localstorage
            adb reboot
            wait_boot
            adb shell pm revoke com.rs.localstorage android.permission.NEARBY_WIFI_DEVICES || true
            adb shell dumpsys package com.rs.localstorage | grep -A4 'NEARBY_WIFI_DEVICES' > "$OUT/permission-denied.txt" || true

            python3 -m http.server 19090 --bind 0.0.0.0 >/tmp/wave5-host-http.log 2>&1 &
            HOST_PID=$!
            trap 'kill $HOST_PID 2>/dev/null || true' EXIT
            sleep 1

            set +e
            adb shell "run-as com.rs.localstorage sh -c 'printf \"HEAD / HTTP/1.0\\r\\n\\r\\n\" | /system/bin/toybox nc -w 3 10.0.2.2 19090 >/dev/null 2>/sdcard/rs-lnp-denied.err'"
            DENIED_RC=$?
            set -e
            echo "LNP_DENIED_APP_UID_RC=$DENIED_RC"
            test "$DENIED_RC" -ne 0
            echo 'LNP_DENIED_APP_UID_LAN_BLOCKED=true'

            adb shell monkey -p com.rs.localstorage -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 3
            tap_text 'Ativar servidor'
            sleep 2
            adb exec-out screencap -p > "$OUT/01-nearby-permission-request.png"
            if ! tap_text "don't allow"; then
              tap_text 'não permitir'
            fi
            sleep 6
            adb shell dumpsys activity services com.rs.localstorage > "$OUT/services-after-denial.txt"
            grep -q 'HotspotServerService' "$OUT/services-after-denial.txt"
            echo 'DENIED_NEARBY_SERVER_SERVICE_STARTED=true'
            adb forward tcp:18081 tcp:8080
            if curl -fsS --max-time 3 http://127.0.0.1:18081/login >/dev/null; then
              echo 'DENIED_NEARBY_LOOPBACK_SERVER_RUNNING=true'
            else
              echo 'DENIED_NEARBY_LOOPBACK_SERVER_RUNNING=false'
            fi

            adb shell pm grant com.rs.localstorage android.permission.NEARBY_WIFI_DEVICES
            adb shell dumpsys package com.rs.localstorage | grep -A4 'NEARBY_WIFI_DEVICES' > "$OUT/permission-granted.txt" || true
            adb shell "run-as com.rs.localstorage sh -c 'printf \"HEAD / HTTP/1.0\\r\\n\\r\\n\" | /system/bin/toybox nc -w 3 10.0.2.2 19090 >/dev/null'"
            echo 'LNP_GRANTED_APP_UID_LAN_WORKS=true'

            adb exec-out run-as com.rs.localstorage cat shared_prefs/rs.xml > "$OUT/server-prefs-after-grant.xml" 2>/dev/null || true
            adb logcat -d -t 1200 | grep -E 'AndroidRuntime|FATAL EXCEPTION|EPERM|ECONNABORTED|JmDNS|com\.rs\.localstorage' > "$OUT/logcat-tail.txt" || true
            echo 'ANDROID16_LNP_REAL_UID_GATE=PASS'
            echo 'FINAL_AUDIT_COMPLETE=NO'

      - name: Publish safe Wave 5 evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave5-local-network-evidence
          path: audit-out/wave5/
          retention-days: 7
          if-no-files-found: warn

  wave5-gate:
    name: Wave 5 automated network gate
    if: always()
    needs: [production-network-policy-contract, android16-lnp-real-uid]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          echo "policy=${{ needs.production-network-policy-contract.result }}"
          echo "android16-lnp=${{ needs.android16-lnp-real-uid.result }}"
          test "${{ needs.production-network-policy-contract.result }}" = success
          test "${{ needs.android16-lnp-real-uid.result }}" = success
          echo 'WAVE5_AUTOMATED_NETWORK_EVIDENCE=PASS'
          echo 'FINAL_AUDIT_COMPLETE=NO — physical hotspot/Wi-Fi clients remain mandatory.'
