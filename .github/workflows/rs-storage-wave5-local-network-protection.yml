name: RS Storage Audit Wave 5 Local Network Protection

on:
  workflow_dispatch:
  push:
    branches: [editor]
    paths:
      - '.github/workflows/rs-storage-wave5-local-network-protection.yml'
      - 'audit/RsLocalNetworkPolicyContractTest.java'
      - 'audit/rsstorage_wave5_lnp_runtime.sh'

concurrency:
  group: rs-storage-wave5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TARGET_REF: release/v4.7.13-agent-harness
  ROOT: target/source/current-v4.3.0

jobs:
  production-network-policy-contract:
    name: Production network policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Compile the actual production policy with the public contract harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs-network-classes
          javac -d /tmp/rs-network-classes \
            "$ROOT/rsapp/src/main/java/com/rs/localstorage/RsLocalNetworkPolicy.java" \
            audit/RsLocalNetworkPolicyContractTest.java
          java -cp /tmp/rs-network-classes com.rs.localstorage.RsLocalNetworkPolicyContractTest
      - name: Record compatibility-risk markers without publishing source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          policy=Path('target/source/current-v4.3.0/rsapp/src/main/java/com/rs/localstorage/RsLocalNetworkPolicy.java').read_text(encoding='utf-8')
          discovery=Path('target/source/current-v4.3.0/rsapp/src/main/java/com/rs/localstorage/LocalDiscoveryManager.java').read_text(encoding='utf-8')
          main=Path('target/source/current-v4.3.0/rsapp/src/main/java/com/rs/localstorage/MainActivity.java').read_text(encoding='utf-8')
          service=Path('target/source/current-v4.3.0/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java').read_text(encoding='utf-8')
          assert 'return false;' in policy
          assert 'isLanInterface(NetworkInterface network)' in policy
          assert 'name.startsWith("rmnet")' in policy and 'name.contains("vpn")' in policy
          assert 'first == 100 && second >= 64 && second <= 127' in policy
          assert 'first == 169 && second == 254' in policy
          assert 'address instanceof Inet6Address' in policy
          assert 'interfaceScore(name)' in discovery and 'selectBestAddress()' in discovery
          assert 'RsLocalNetworkPolicy.isLocalInterfaceAddress(a)' in discovery
          assert 'RsLocalNetworkPolicy.isLanInterface(ni)' in discovery
          assert 'String localHttpUrl(InetAddress address)' in service
          assert 'host.replace("%","%25")' in service
          assert 'refreshIfAddressChanged' in discovery
          assert 'startDiscoveryRefresh()' in service and 'refreshDiscoveryBinding()' in service
          assert 'networkHandler.removeCallbacks(networkRefresh)' in service
          assert 'Session s=session(h,remote)' in service
          assert '!s.remote.equals(remote)' in service
          assert 'transfers.entrySet().removeIf(e->tok.equals(e.getValue().ownerToken))' in service
          assert 'if(nearbyMissing)toast(' in main and 'startServerAfterPermissions();' in main
          print('NETWORK_UNRESOLVED_INTERFACE_FAIL_CLOSED=true')
          print('NETWORK_WWAN_VPN_EXCLUDED=true')
          print('NETWORK_ACCEPTS_CGNAT_100_64=true')
          print('NETWORK_ACCEPTS_IPV4_LINK_LOCAL_169_254=true')
          print('NETWORK_SUPPORTS_IPV6_LOCAL_PREFIXES=true')
          print('NETWORK_MDNS_MULTISTACK_BINDING=true')
          print('NETWORK_MDNS_REBIND_ON_ADDRESS_CHANGE=true')
          print('NETWORK_RISK_MDNS_STALE_BINDING=false')
          print('SESSION_SOURCE_IP_BINDING=true')
          print('DENIED_NEARBY_CALLBACK_CAN_START_SERVER=true')
          print('PHYSICAL_NETWORK_GATE=NOT_RUN')
          PY

  android16-lnp-real-uid:
    name: Android 16 LNP app-UID enforcement + denied permission behavior
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Build x86_64 candidate privately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-builds audit-out/wave5
          python3 - <<'PY'
          from pathlib import Path
          p=Path('target/source/current-v4.3.0/rsapp/build.gradle.kts')
          s=p.read_text(encoding='utf-8'); old='abiFilters += listOf("arm64-v8a")'; assert old in s
          p.write_text(s.replace(old,'abiFilters += listOf("x86_64")'),encoding='utf-8')
          PY
          mkdir -p external/llama.cpp
          git -C external/llama.cpp init
          git -C external/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C external/llama.cpp fetch --depth=1 origin 8ef78e644f559db4e8716b59bf76b8e11619337d
          git -C external/llama.cpp checkout --detach FETCH_HEAD
          python3 target/scripts/apply_llama_rs_compat.py external/llama.cpp
          python3 target/scripts/apply_v434_load_progress.py external/llama.cpp
          python3 target/scripts/apply_v450_llama_runtime.py external/llama.cpp
          # CI emulator optimization only: build the native library for x86_64 only.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('external/llama.cpp/examples/llama.android/lib/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          old='abiFilters += listOf("arm64-v8a", "x86_64")'
          assert old in s, p
          p.write_text(s.replace(old,'abiFilters += listOf("x86_64")'),encoding='utf-8')
          PY
          SETTINGS=external/llama.cpp/examples/llama.android/settings.gradle.kts
          grep -q 'include(":rsapp")' "$SETTINGS" || printf '\ninclude(":rsapp")\n' >> "$SETTINGS"
          cp -R "$ROOT/rsapp" external/llama.cpp/examples/llama.android/rsapp
          chmod +x external/llama.cpp/examples/llama.android/gradlew
          cd external/llama.cpp/examples/llama.android
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456" ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon
          APK=$(find rsapp/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" "${{ github.workspace }}/private-builds/candidate.apk"
          cd "${{ github.workspace }}"
          unzip -l private-builds/candidate.apk | grep -q 'lib/x86_64/'
          echo 'X86_64_APK_ABI=PASS' > audit-out/wave5/x86-abi.txt

      - name: Exercise Android 16 local-network protections with the app UID
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash "${{ github.workspace }}/audit/rsstorage_wave5_lnp_runtime.sh" "${{ github.workspace }}"
      - name: Publish safe Wave 5 evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave5-local-network-evidence
          path: audit-out/wave5/
          retention-days: 7
          if-no-files-found: warn

  wave5-gate:
    name: Wave 5 automated network gate
    if: always()
    needs: [production-network-policy-contract, android16-lnp-real-uid]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          echo "policy=${{ needs.production-network-policy-contract.result }}"
          echo "android16-lnp=${{ needs.android16-lnp-real-uid.result }}"
          test "${{ needs.production-network-policy-contract.result }}" = success
          test "${{ needs.android16-lnp-real-uid.result }}" = success
          echo 'WAVE5_AUTOMATED_NETWORK_EVIDENCE=PASS'
          echo 'FINAL_AUDIT_COMPLETE=NO — physical hotspot/Wi-Fi clients remain mandatory.'
