name: RS Screen Manager WinUI 3 C++ UI
on:
  push:
    branches: [feature/rs-screen-manager, editor]
    paths:
      - 'apps/rs-screen-manager/winui/**'
      - '.github/workflows/rs-screen-manager-winui.yml'
  pull_request:
    branches: [editor]
    paths:
      - 'apps/rs-screen-manager/winui/**'
      - '.github/workflows/rs-screen-manager-winui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rs-screen-winui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-winui:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: NuGet restore native C++ WinUI project dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $directory='apps/rs-screen-manager/winui'
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress --limit-output
          }
          nuget restore "$directory/packages.config" -PackagesDirectory "$directory/packages" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet native C++ restore failed' }
      - name: Compile Windows App SDK / C++ WinRT
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project='apps/rs-screen-manager/winui/RSScreenManagerUI.vcxproj'
          msbuild.exe $project /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw 'WinUI C++ compile failed' }
          $items=Get-ChildItem 'apps/rs-screen-manager/winui' -Recurse -Filter RSScreenManagerUI.exe | Where-Object { $_.FullName -notmatch '\\packages\\' }
          if (-not $items) { throw 'WinUI EXE not produced' }
          $path=($items | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          Write-Output "WINUI_EXE=$path"
          "$path" | Set-Content winui-path.txt
      - name: Collect WinUI self-contained files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-Content winui-path.txt -Raw
          $exe=$exe.Trim()
          $dir=Split-Path $exe -Parent
          New-Item -Type Directory -Path 'dist/RS-Screen-Manager-WinUI' -Force | Out-Null
          Copy-Item "$dir/*" -Destination 'dist/RS-Screen-Manager-WinUI' -Recurse -Force
          if (!(Test-Path dist/RS-Screen-Manager-WinUI/RSScreenManagerUI.exe)) { throw 'WinUI package missing' }
          Compress-Archive 'dist/RS-Screen-Manager-WinUI' dist/RS-Screen-Manager-WinUI-preview.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: RS-Screen-Manager-WinUI-preview
          path: dist/RS-Screen-Manager-WinUI-preview.zip
          if-no-files-found: error
          retention-days: 14
