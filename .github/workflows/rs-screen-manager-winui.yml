name: RS Screen Manager WinUI 3 C++ UI
on:
  push:
    branches: [feature/rs-screen-manager, editor]
    paths:
      - 'apps/rs-screen-manager/winui/**'
      - 'apps/rs-screen-manager/core/**'
      - 'apps/rs-screen-manager/tests/**'
      - 'apps/rs-screen-manager/packaging/RS-Screen-Manager-WinUI.iss'
      - '.github/workflows/rs-screen-manager-winui.yml'
  pull_request:
    branches: [editor]
    paths:
      - 'apps/rs-screen-manager/winui/**'
      - 'apps/rs-screen-manager/core/**'
      - 'apps/rs-screen-manager/tests/**'
      - 'apps/rs-screen-manager/packaging/RS-Screen-Manager-WinUI.iss'
      - '.github/workflows/rs-screen-manager-winui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rs-screen-winui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-winui:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: NuGet restore native C++ WinUI project dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $directory='apps/rs-screen-manager/winui'
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress --limit-output
          }
          nuget restore "$directory/packages.config" -PackagesDirectory "$directory/packages" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet native C++ restore failed' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate connect+ application icon (multi-resolution ICO)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow icon generator dependency failed' }
          python apps/rs-screen-manager/winui/tools/generate_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'RS icon generation failed' }
          foreach ($icon in 'rs-screen-manager.ico','rs-screen-manager.png') {
            if (!(Test-Path "apps/rs-screen-manager/winui/assets/$icon")) { throw "Generated icon missing: $icon" }
          }
      - name: Verify WinUI UI polish invariants
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python apps/rs-screen-manager/winui/tools/check_ui_polish.py
          if ($LASTEXITCODE -ne 0) { throw 'WinUI UI polish regression gate failed' }
      - name: Compile Windows App SDK / C++ WinRT
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project='apps/rs-screen-manager/winui/RSScreenManagerUI.vcxproj'
          msbuild.exe $project /t:Build /p:Configuration=Release /p:Platform=x64 /m /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw 'WinUI C++ compile failed' }
          $items=Get-ChildItem 'apps/rs-screen-manager/winui' -Recurse -Filter RSScreenManagerUI.exe | Where-Object { $_.FullName -notmatch '\\packages\\' }
          if (-not $items) { throw 'WinUI EXE not produced' }
          $path=($items | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          Write-Output "WINUI_EXE=$path"
          "$path" | Set-Content winui-path.txt
      - name: Collect WinUI self-contained files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-Content winui-path.txt -Raw
          $exe=$exe.Trim()
          $dir=Split-Path $exe -Parent
          New-Item -Type Directory -Path 'dist/RS-Screen-Manager-WinUI' -Force | Out-Null
          Copy-Item "$dir/*" -Destination 'dist/RS-Screen-Manager-WinUI' -Recurse -Force
          if (!(Test-Path dist/RS-Screen-Manager-WinUI/RSScreenManagerUI.exe)) { throw 'WinUI package missing' }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile the native fallback manager
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O2 /DNDEBUG /DUNICODE /D_UNICODE /Fe:dist/RS-Screen-Manager-WinUI/RS-Screen-Manager.exe apps/rs-screen-manager/src/main.cpp /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib dwmapi.lib comctl32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Native fallback manager failed to compile' }
          cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O2 /Fe:dist/game-mapping-test.exe apps/rs-screen-manager/tests/game_mapping_test.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Touch mapping test build failed' }
          & dist/game-mapping-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Touch mapping tests failed' }
          cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O2 /Fe:dist/virtual-display-policy-test.exe apps/rs-screen-manager/tests/virtual_display_policy_test.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Display policy test compilation failed' }
          & dist/virtual-display-policy-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Auto orientation/clipboard policy tests failed' }
          cl.exe /nologo /utf-8 /std:c++20 /EHsc /W4 /O2 /Fe:dist/windows-hotspot-test.exe apps/rs-screen-manager/tests/windows_hotspot_test.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Windows hotspot test build failed' }
          & dist/windows-hotspot-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows hotspot networking tests failed' }
      - name: Bundle scrcpy 5.0.1 and ADB with pinned integrity hash
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip'
          Invoke-WebRequest -Uri $url -OutFile scrcpy.zip -MaximumRedirection 10
          $expected='b12a2c4ee8be317422451fc7dcf8ee20a71b5ea7ef9ad73ddd825a25316227a5'
          $actual=(Get-FileHash scrcpy.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "scrcpy release SHA mismatch: $actual" }
          Expand-Archive scrcpy.zip -DestinationPath scrcpy-extract -Force
          New-Item -Type Directory -Path dist/RS-Screen-Manager-WinUI/tools -Force | Out-Null
          Copy-Item -Path 'scrcpy-extract/scrcpy-win64-v5.0.1/*' -Destination 'dist/RS-Screen-Manager-WinUI/tools' -Recurse -Force
          Copy-Item apps/rs-screen-manager/README.md dist/RS-Screen-Manager-WinUI/README.md
          foreach ($bin in 'adb.exe','scrcpy.exe','scrcpy-server') {
            if (!(Test-Path "dist/RS-Screen-Manager-WinUI/tools/$bin")) { throw "Required tool missing: $bin" }
          }
      - name: Build WinUI installer and portable bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc apps/rs-screen-manager/packaging/RS-Screen-Manager-WinUI.iss
          if ($LASTEXITCODE -ne 0) { throw 'WinUI installer compilation failed' }
          Get-ChildItem dist/RS-Screen-Manager-WinUI -File | Select-Object Name,Length
          Compress-Archive 'dist/RS-Screen-Manager-WinUI' dist/RS-Screen-Manager-WinUI-Portable-x64.zip -Force
          if (!(Test-Path dist/RS-Screen-Manager-WinUI-Setup-x64.exe)) { throw 'WinUI setup executable missing' }
          if (!(Test-Path dist/RS-Screen-Manager-WinUI-Portable-x64.zip)) { throw 'WinUI portable archive missing' }
          @(
            "setup_sha256=$((Get-FileHash dist/RS-Screen-Manager-WinUI-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant())"
            "zip_sha256=$((Get-FileHash dist/RS-Screen-Manager-WinUI-Portable-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant())"
          ) | Set-Content dist/RS-Screen-Manager-WinUI-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RS-Screen-Manager-WinUI-Full-Bundle
          path: |
            dist/RS-Screen-Manager-WinUI-Portable-x64.zip
            dist/RS-Screen-Manager-WinUI-Setup-x64.exe
            dist/RS-Screen-Manager-WinUI-SHA256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload installer-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: RS-Screen-Manager-Setup-Only
          path: dist/RS-Screen-Manager-WinUI-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
