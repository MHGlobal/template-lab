name: RS Storage 4.7.1 Audit Public Runner

on:
  workflow_dispatch:
  push:
    branches: [ rs-storage-v471-audit-runner ]
    paths:
      - '.github/workflows/rs-storage-v471-public-runner.yml'

permissions:
  contents: read

concurrency:
  group: rs-storage-v471-audit-public-runner
  cancel-in-progress: true

jobs:
  build-v471:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout public runner repository
        uses: actions/checkout@v4

      - name: Checkout private RS-Storage corrective source
        uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: fix/v4.7-audit-blockers
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: private-src
          persist-credentials: false

      - name: Verify private source identity
        shell: bash
        run: |
          set -euxo pipefail
          test -f private-src/scripts/materialize_v471_release.sh
          test -f private-src/source/current-v4.3.0/dynamic-ui/public/rs-file-v471.js
          test -f private-src/source/current-v4.3.0/dynamic-ui/public/rs-file-v471-hardening.js
          echo "RS_STORAGE_COMMIT=$(git -C private-src rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize canonical 4.7.1 release and static invariants
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=source/current-v4.3.0
          chmod +x scripts/materialize_v471_release.sh
          scripts/materialize_v471_release.sh "$ROOT" | tee ../v471-static-gates.txt
          grep -q 'versionCode = 91' "$ROOT/rsapp/build.gradle.kts"
          grep -q 'versionName = "4.7.1"' "$ROOT/rsapp/build.gradle.kts"
          ! grep -q 'MODELO PADRÃO' "$ROOT/rsapp/src/main/java/com/rs/localstorage/AiActivity.kt"
          node --check "$ROOT/dynamic-ui/public/rs-file-v471.js"
          node --check "$ROOT/dynamic-ui/public/rs-file-v471-hardening.js"
          node --check "$ROOT/rsapp/src/main/assets/rs-ai/app.js"
          node --check scripts/rsfile_v471_runtime_gate.mjs

      - name: Install Chromium behavior gate
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute RS FILE browser/runtime behaviors
        working-directory: private-src
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/rsfile_v471_runtime_gate.mjs source/current-v4.3.0 | tee ../rsfile-runtime-gate.txt
          grep -q 'RS FILE browser/runtime behaviors passed' ../rsfile-runtime-gate.txt

      - name: Build Dynamic UI
        working-directory: private-src/source/current-v4.3.0/dynamic-ui
        shell: bash
        run: |
          set -euxo pipefail
          npm pkg set 'devDependencies.@vitejs/plugin-react=5.1.4'
          npm install --no-audit --no-fund
          npm run build
          test -s dist/app.js
          test -s dist/style.css
          test -s dist/rs-file-v471.js
          test -s dist/rs-file-v471-hardening.js
          rm -rf ../rsapp/src/main/assets/rs-dynamic
          mkdir -p ../rsapp/src/main/assets/rs-dynamic
          cp -a dist/. ../rsapp/src/main/assets/rs-dynamic/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Clone and patch pinned llama.cpp
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout 8ef78e644f559db4e8716b59bf76b8e11619337d
          python3 private-src/scripts/apply_llama_rs_compat.py llama.cpp
          python3 private-src/scripts/apply_v434_load_progress.py llama.cpp
          python3 private-src/scripts/apply_v450_llama_runtime.py llama.cpp
          rm -rf llama.cpp/examples/llama.android/rsapp
          cp -R private-src/source/current-v4.3.0/rsapp llama.cpp/examples/llama.android/rsapp
          grep -q 'include(":rsapp")' llama.cpp/examples/llama.android/settings.gradle.kts || printf '\ninclude(":rsapp")\n' >> llama.cpp/examples/llama.android/settings.gradle.kts
          chmod +x llama.cpp/examples/llama.android/gradlew
          cat >> llama.cpp/examples/llama.android/gradle.properties <<'GP'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          GP

      - name: Compile unit tests Kotlin and Java
        working-directory: llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew :rsapp:testDebugUnitTest :rsapp:compileDebugKotlin :rsapp:compileDebugJavaWithJavac --stacktrace --no-daemon

      - name: Assemble RS Storage 4.7.1 ARM64 APK
        working-directory: llama.cpp/examples/llama.android
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
        run: |
          set -euxo pipefail
          ./gradlew :rsapp:assembleDebug --stacktrace --no-daemon

      - name: Validate and stage APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="llama.cpp/examples/llama.android/rsapp/build/outputs/apk/debug/rsapp-debug.apk"
          OUT="RS-Storage-v4.7.1-audit-blockers-arm64.apk"
          test -s "$APK"
          test "$(stat -c '%s' "$APK")" -gt 30000000
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "versionCode='91'" apk-badging.txt
          grep -q "versionName='4.7.1'" apk-badging.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libai-chat.so'
          ABIS="$(unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u | xargs)"
          test "$ABIS" = "arm64-v8a"
          unzip -l "$APK" | grep -q 'assets/rs-ai/app.js'
          unzip -l "$APK" | grep -q 'assets/rs-dynamic/rs-file-v471.js'
          unzip -l "$APK" | grep -q 'assets/rs-dynamic/rs-file-v471-hardening.js'
          unzip -p "$APK" assets/rs-ai/app.js | grep -q '^/\* RS IA 4.7.1 '
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK" | tee apksigner.txt
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee SHA256SUMS.txt
          stat -c '%s' "$OUT" | tee APK_SIZE_BYTES.txt
          printf 'version=4.7.1\nversionCode=91\nabi=arm64-v8a\nrs_storage_commit=%s\n' "$RS_STORAGE_COMMIT" | tee BUILD_REPORT.txt
          cp rsfile-runtime-gate.txt RSFILE_RUNTIME_GATE.txt
          cp v471-static-gates.txt V471_STATIC_GATES.txt
          cat > CI_SCOPE.txt <<'EOF'
          Validated: canonical v4.7.1 materialization; source invariants; Chromium RS FILE login scope, durable navigation state, long-press suppression, three-dot menu, independent selection, invalid self/subfolder destination, Open With request, selected upload persistence after full reload, server copy progress/cancel; Android unit/compile; ARM64 APK packaging, version, ABI, assets and signature.
          Not claimed: physical-device gesture/WebView validation on the Redmi handset or a live external AI provider task. Those are separate device/provider validation scopes.
          EOF

      - name: Upload RS Storage 4.7.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: RS-Storage-v4.7.1-audit-blockers-ARM64
          path: |
            RS-Storage-v4.7.1-audit-blockers-arm64.apk
            SHA256SUMS.txt
            APK_SIZE_BYTES.txt
            BUILD_REPORT.txt
            apk-badging.txt
            apksigner.txt
            RSFILE_RUNTIME_GATE.txt
            V471_STATIC_GATES.txt
            CI_SCOPE.txt
          if-no-files-found: error
          retention-days: 30
