name: RS Storage Audit Wave 2 Real Task Gates

on:
  workflow_dispatch:
  push:
    branches: [ editor ]
    paths:
      - '.github/workflows/rs-storage-wave2-real-task.yml'
      - 'reports/rs-storage-wave1-findings.md'

permissions:
  contents: read

env:
  TARGET_REPOSITORY: MHGlobal/RS-Storage
  TARGET_REF: 3f9810213c7bfea619fea3a664eda32c8afaed45
  ROOT: target/source/current-v4.3.0

jobs:
  agent-runtime-surface:
    name: Agent runtime tool surface
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      blockers: ${{ steps.surface.outputs.blockers }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile runtime-owned Agent Harness
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/rs-wave2-agent
          WORK=/tmp/rs-wave2-agent-workspace
          rm -rf "$OUT" "$WORK"
          mkdir -p "$OUT" "$WORK" audit-out
          javac -d "$OUT" \
            "$ROOT"/rsapp/src/main/java/com/rs/localstorage/{AgentDefinition,AgentRegistry,RunStateMachine,AgentEventBus,TaskLedger,ToolDefinition,ToolResult,ToolRegistry,PermissionEngine,WorkspaceGuard,RuntimeToolExecutors,NormalizedModelResponse,ReasoningPrivacy,ProviderCapabilityResolver,ProviderAdapters,ProgressDetector,DoomLoopDetector,RecoveryEngine,CompletionGate,ExecutionLoop,SessionEngine,MemoryEngine,ChangeSetEngine,SubagentManager,ContextEngine,ContextBudgetManager,AgentExtensions,AgentHarness}.java
          cat > /tmp/AuditToolSurfaceMain.java <<'JAVA'
          package com.rs.localstorage;
          import java.nio.file.Path;
          import java.util.Set;
          import java.util.TreeSet;
          public final class AuditToolSurfaceMain {
            public static void main(String[] args) throws Exception {
              AgentHarness h=new AgentHarness("audit-session","audit-run","engineer",Path.of(args[0]),null,null,null,null);
              ToolRegistry r=h.tools;
              Set<String> names=new TreeSet<String>();
              int nullExecutors=0;
              for(ToolDefinition t:r.list()){names.add(t.name);if(t.executor==null)nullExecutors++;}
              PermissionEngine p=h.permissions;
              System.out.println("runtime_tool_count="+names.size());
              System.out.println("git_status="+names.contains("git_status"));
              System.out.println("git_diff="+names.contains("git_diff"));
              System.out.println("git_log="+names.contains("git_log"));
              System.out.println("git_commit="+names.contains("git_commit"));
              System.out.println("git_push="+names.contains("git_push"));
              System.out.println("null_executor_count="+nullExecutors);
              System.out.println("engineer_git_commit_policy="+p.evaluate("git.commit",false,false).decision);
              System.out.println("engineer_git_push_policy="+p.evaluate("git.push",false,false).decision);
              System.out.println("engineer_git_status_policy="+p.evaluate("git.status",false,false).decision);
              System.out.println("engineer_git_diff_policy="+p.evaluate("git.diff",false,false).decision);
              h.close();
            }
          }
          JAVA
          javac -cp "$OUT" -d "$OUT" /tmp/AuditToolSurfaceMain.java
          java -cp "$OUT" com.rs.localstorage.AuditToolSurfaceMain "$WORK" | tee audit-out/agent-runtime-surface.txt
      - name: Classify runtime surface
        id: surface
        shell: bash
        run: |
          set -euo pipefail
          REPORT=audit-out/agent-runtime-surface.txt
          blockers=0
          grep -q '^git_status=true$' "$REPORT"
          grep -q '^git_diff=true$' "$REPORT"
          grep -q '^git_log=true$' "$REPORT"
          grep -q '^null_executor_count=0$' "$REPORT"
          grep -q '^engineer_git_commit_policy=ASK$' "$REPORT"
          grep -q '^engineer_git_push_policy=ASK$' "$REPORT"
          if grep -q '^git_commit=false$' "$REPORT"; then blockers=$((blockers+1)); fi
          if grep -q '^git_push=false$' "$REPORT"; then blockers=$((blockers+1)); fi
          echo "blockers=$blockers" | tee -a "$REPORT"
          echo "blockers=$blockers" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave2-agent-runtime-surface
          path: audit-out/agent-runtime-surface.txt
          retention-days: 7
          if-no-files-found: error

  workspace-recovery-e2e:
    name: Workspace guard + undo/redo real task
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Execute synthetic edit, rollback, redo and boundary attacks
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/rs-wave2-workspace; WORK=/tmp/rs-wave2-fixture; OUTSIDE=/tmp/rs-wave2-outside
          rm -rf "$OUT" "$WORK" "$OUTSIDE"; mkdir -p "$OUT" "$WORK/src" "$OUTSIDE" audit-out
          printf 'before\n' > "$WORK/src/demo.txt"; printf 'secret\n' > "$OUTSIDE/secret.txt"; ln -s "$OUTSIDE" "$WORK/escape"
          cat > /tmp/AuditWorkspaceMain.java <<'JAVA'
          package com.rs.localstorage;
          import java.nio.charset.StandardCharsets; import java.nio.file.Files; import java.nio.file.Path;
          public final class AuditWorkspaceMain { static void require(boolean v,String m){if(!v)throw new AssertionError(m);} public static void main(String[] a)throws Exception{ Path root=Path.of(a[0]); WorkspaceGuard guard=new WorkspaceGuard(root); ChangeSetEngine changes=new ChangeSetEngine(guard); Path file=guard.resolve("src/demo.txt"); byte[] before=Files.readAllBytes(file),after="after\n".getBytes(StandardCharsets.UTF_8); changes.record("audit-run","tool-edit-1","src/demo.txt",before,after); Files.write(file,after); require(Files.readString(file).equals("after\n"),"edit not persisted"); changes.undo(); require(Files.readString(file).equals("before\n"),"undo failed"); changes.redo(); require(Files.readString(file).equals("after\n"),"redo failed"); boolean traversalBlocked=false,encodedBlocked=false,symlinkBlocked=false; try{guard.resolve("../rs-wave2-outside/secret.txt");}catch(SecurityException e){traversalBlocked=true;} try{guard.resolve("%2e%2e%2frs-wave2-outside%2fsecret.txt");}catch(SecurityException e){encodedBlocked=true;} try{guard.resolve("escape/secret.txt");}catch(SecurityException e){symlinkBlocked=true;} require(traversalBlocked&&encodedBlocked&&symlinkBlocked,"workspace boundary failure"); System.out.println("workspace_recovery=true"); }}
          JAVA
          javac -d "$OUT" "$ROOT"/rsapp/src/main/java/com/rs/localstorage/{WorkspaceGuard,ChangeSetEngine}.java /tmp/AuditWorkspaceMain.java
          java -cp "$OUT" com.rs.localstorage.AuditWorkspaceMain "$WORK" | tee audit-out/workspace-recovery-e2e.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: wave2-workspace-recovery-e2e, path: audit-out/workspace-recovery-e2e.txt, retention-days: 7 }

  completion-integrity:
    name: Completion gate cannot self-approve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MHGlobal/RS-Storage
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.RS_STORAGE_READ_TOKEN }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Exercise incomplete and complete software-change evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/rs-wave2-completion; mkdir -p "$OUT" audit-out
          cat > /tmp/AuditCompletionMain.java <<'JAVA'
          package com.rs.localstorage; public final class AuditCompletionMain { static void require(boolean v,String m){if(!v)throw new AssertionError(m);} public static void main(String[] a){ CompletionGate g=new CompletionGate(); CompletionGate.Evidence e=new CompletionGate.Evidence(); require(!g.evaluate(e).pass,"empty evidence passed"); e.objectiveSatisfied=true;e.requiredTasksResolved=true;e.noPendingTools=true;e.noBlockingError=true;e.changesPersisted=true;e.validationAttempted=true;e.permissionsRespected=true;e.workspaceIntact=true;e.softwareChange=true;e.diffKnown=false; require(!g.evaluate(e).pass,"unknown diff passed"); e.diffKnown=true; require(g.evaluate(e).pass,"complete evidence failed"); System.out.println("completion_integrity=true"); }}
          JAVA
          javac -d "$OUT" "$ROOT"/rsapp/src/main/java/com/rs/localstorage/CompletionGate.java /tmp/AuditCompletionMain.java
          java -cp "$OUT" com.rs.localstorage.AuditCompletionMain | tee audit-out/completion-integrity.txt
      - uses: actions/upload-artifact@v4
        with: { name: wave2-completion-integrity, path: audit-out/completion-integrity.txt, retention-days: 7 }

  wave2-production-gate:
    name: Wave 2 production gate
    if: always()
    needs: [agent-runtime-surface, workspace-recovery-e2e, completion-integrity]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce evidence, not test-count optimism
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.agent-runtime-surface.result }}' = success
          test '${{ needs.workspace-recovery-e2e.result }}' = success
          test '${{ needs.completion-integrity.result }}' = success
          test '${{ needs.agent-runtime-surface.outputs.blockers }}' = '0'
          echo 'WAVE2_AUTOMATED_REAL_TASK_GATES=PASS'
          echo 'FINAL_AUDIT_COMPLETE=NO — Android-served UI, upgrade, performance and physical-network evidence remain mandatory.'
