name: Export RS Local Storage V4.3 Materialized Source

on:
  pull_request:
    branches: [ rs-local-storage-v42-ci-wrapper-final ]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install parser
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Materialize complete V4.2.5 source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('.github/workflows/rs-local-storage-v411-r11.yml').read_text())
          wanted = {'Reuse validated R10 source pipeline','Apply R11 navigation UX and accessibility hardening'}
          found=set()
          for step in wf['jobs']['build']['steps']:
              if step.get('name') in wanted:
                  subprocess.run(['bash','-lc',step['run']],check=True)
                  found.add(step['name'])
          missing=wanted-found
          if missing:
              raise SystemExit(f'Missing source stages: {sorted(missing)}')
          PY
          base64 -d rs-v42/apply_v42.py.gz.b64 | gunzip > /tmp/apply_v42.py
          python3 -m py_compile /tmp/apply_v42.py
          python3 /tmp/apply_v42.py

      - name: Apply V4.3 source overlay
        run: |
          set -euxo pipefail
          cat rs-v43/bootstrap.part-* | base64 -d | gunzip > /tmp/rs-v43-bootstrap.py
          python3 -m py_compile /tmp/rs-v43-bootstrap.py
          python3 /tmp/rs-v43-bootstrap.py
          grep -q 'versionName = "4.3.0"' rs-local-storage-v41/rsapp/build.gradle.kts
          grep -q 'generateStreamingDetailed' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/AiWebBridge.kt
          grep -q 'reasoning_token' rs-local-storage-v41/rsapp/src/main/java/com/rs/localstorage/HotspotServerService.java
          test -f rs-v43/rs-dynamic/package.json
          test -f rs-v43/rs-dynamic/src/main.jsx

      - name: Export self-contained project source
        run: |
          set -euxo pipefail
          mkdir -p export/RS-Storage-v4.3.0
          cp -a rs-local-storage-v41/. export/RS-Storage-v4.3.0/
          mkdir -p export/RS-Storage-v4.3.0/dynamic-ui
          cp -a rs-v43/rs-dynamic/. export/RS-Storage-v4.3.0/dynamic-ui/
          mkdir -p export/RS-Storage-v4.3.0/migration-provenance
          cp .github/workflows/rs-local-storage-v43-full.yml export/RS-Storage-v4.3.0/migration-provenance/
          cp rs-v42/apply_v42.py.gz.b64 export/RS-Storage-v4.3.0/migration-provenance/
          cp rs-v43/bootstrap.part-* export/RS-Storage-v4.3.0/migration-provenance/
          tar -czf RS-Storage-v4.3.0-materialized-source.tar.gz -C export RS-Storage-v4.3.0
          sha256sum RS-Storage-v4.3.0-materialized-source.tar.gz > RS-Storage-v4.3.0-materialized-source.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RS-Storage-v4.3.0-Materialized-Source
          path: |
            RS-Storage-v4.3.0-materialized-source.tar.gz
            RS-Storage-v4.3.0-materialized-source.sha256
          if-no-files-found: error
          retention-days: 7
