name: Build RS Local Storage APK
on:
  pull_request:
    branches: [ editor ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build APK
        working-directory: rs-local-storage
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RS-Local-Storage-APK
          path: rs-local-storage/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
