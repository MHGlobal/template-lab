plugins { id 'com.android.application' }

android {
    namespace 'com.rs.localstorage'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rs.localstorage'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0.0-cinema'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
